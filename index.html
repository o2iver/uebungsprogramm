<style>
:root{
  --papier:#F1F4F0; --tinte:#16211C; --gruen:#0E4D3F; --gruen-hell:#1A6E5C; --gruen-zart:#E3EEE9;
  --signal:#E8A33D; --stumm:#55665E; --rand:#D3DBD5;
  --display:'Avenir Next Condensed','Helvetica Neue Condensed','Arial Narrow','Roboto Condensed',sans-serif-condensed,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --daten:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papier);color:var(--tinte);font:16px/1.5 var(--text);-webkit-text-size-adjust:100%;
  overflow-wrap:break-word}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.huelle{max-width:640px;margin:0 auto;padding:0 16px 32px}

/* ---------- Kopf ---------- */
.kopf{background:var(--gruen);color:#fff;margin:0 -16px 18px;padding:22px 16px 20px;
  border-bottom:4px solid var(--signal)}
.marke{font:11px/1.3 var(--daten);letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-bottom:8px}
.kopf h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,8.4vw,36px);line-height:1.02;
  text-transform:uppercase;margin:0;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere}
.plantitel{font-size:19px;font-weight:600;margin:10px 0 0}
.zeitraum{font-size:14.5px;opacity:.88;margin:3px 0 0}

/* ---------- Karten ---------- */
.karte{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:16px;margin-bottom:14px}
.karte h2,.einheit-kopf h2{font:700 11px/1.3 var(--daten);letter-spacing:.12em;text-transform:uppercase;
  color:var(--stumm);margin:0 0 10px}
.zeitplan{list-style:none;margin:0 0 14px;padding:0}
.zeitplan li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rand)}
.zeitplan li:last-child{border-bottom:0}
.zeitplan .marker{flex:none;width:9px;height:9px;border-radius:50%;background:var(--signal);transform:translateY(-1px)}
.zeitplan b{font-weight:650}
.leise{color:var(--stumm)}

.knopf{display:block;width:100%;background:var(--gruen);color:#fff;border:0;border-radius:8px;
  padding:15px 12px;font:700 19px/1.2 var(--display);text-transform:uppercase;letter-spacing:.04em;
  cursor:pointer;text-align:center;text-decoration:none;-webkit-tap-highlight-color:transparent}
.knopf:active{background:var(--gruen-hell)}
.knopf.zweit{background:#fff;color:var(--gruen);border:1.5px solid var(--gruen);font-size:16px;padding:12px}
.knopf + .knopf{margin-top:8px}
.hilfe{font-size:14px;color:var(--stumm);margin:10px 0 0}
.hilfe a{color:var(--gruen)}
.google{margin-top:14px;border-top:1px solid var(--rand);padding-top:12px}
.google summary{cursor:pointer;color:var(--gruen);font-weight:600;font-size:15px}
.google p{font-size:14px;margin:8px 0 10px}
.privat{font-size:13px;color:var(--stumm);margin:14px 0 0;padding:9px 11px;background:var(--papier);border-radius:6px}
.iphone{background:#FDF3E1;border-left:4px solid var(--signal);border-radius:6px;padding:10px 12px;
  margin:0 0 12px;font-size:14.5px}
.iphone ol{margin:6px 0 0;padding-left:20px}
.iphone li{margin:3px 0}

.notiz{border-left:4px solid var(--signal)}
.notiz p{margin:0;white-space:pre-line}

/* ---------- Übungen ---------- */
.einheit-kopf{margin:22px 0 10px}
.einheit-kopf .zeit{font-size:14.5px;color:var(--stumm);margin:-4px 0 0}
.einheit-kopf .titel{font:700 22px/1.1 var(--display);text-transform:uppercase;margin:0 0 6px;color:var(--gruen)}
.ue{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.ue-kopf{display:flex;gap:11px;align-items:flex-start}
.ue-nr{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gruen);color:#fff;
  display:grid;place-items:center;font:700 16px/1 var(--display)}
.ue h3{margin:3px 0 8px;font-size:17px;line-height:1.3}
.bilder{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}
.bilder img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--rand);display:block}
.anleitung{margin:0 0 10px}
.dosis{background:var(--gruen-zart);border-radius:6px;padding:8px 10px;font-size:15.5px}
.dosis b{display:block;font:700 10.5px/1.6 var(--daten);letter-spacing:.11em;text-transform:uppercase;color:var(--gruen)}
.vermeiden{font-size:14.5px;color:#46534C;margin:9px 0 0}
.video{display:inline-block;margin-top:10px;color:var(--gruen);font-weight:600}
.fehlt{color:#8a3b12}

/* ---------- Fuß ---------- */
.fuss{font-size:14px;color:#46534C;margin-top:22px}
.fuss p{margin:0 0 10px}
.fuss b{color:var(--tinte)}
.fuss .rechtlich{font-size:12.5px;margin-top:16px}
.fuss .rechtlich a{color:var(--stumm)}

@media print{
  @page{size:A4;margin:12mm 13mm}
  body{background:#fff;font-size:11pt}
  .huelle{max-width:none;padding:0}
  .nur-bildschirm{display:none !important}
  .kopf{background:#fff;color:var(--tinte);margin:0 0 12px;padding:0 0 8px;border-bottom:3px solid var(--gruen)}
  .marke{color:var(--gruen);opacity:1}
  .kopf h1{font-size:26px;color:var(--gruen)}
  .karte,.ue{break-inside:avoid;page-break-inside:avoid;border-color:#bfc8c3;padding:8px 12px;
    margin-bottom:8px;border-radius:6px}
  .karte h2,.einheit-kopf h2{margin-bottom:4px}
  .zeitplan{margin:0}
  .zeitplan li{padding:3px 0}
  .einheit-kopf{margin:12px 0 6px;break-after:avoid;page-break-after:avoid}
  .einheit-kopf .titel{font-size:16pt;margin-bottom:2px}
  .ue-nr{width:22px;height:22px;font-size:12pt}
  .ue h3{font-size:11.5pt;margin:1px 0 4px}
  .anleitung{margin:0 0 6px;font-size:10.5pt}
  .dosis{padding:4px 8px;font-size:10.5pt}
  .vermeiden{font-size:9.5pt;margin-top:4px}
  .fuss{font-size:9.5pt;margin-top:10px}
}
</style>
</head>

<script id="daten" type="application/json">{"version":"0.3","impressum":"","datenschutz":"","uebungen":[{"id":"ADL-AUF-KRA-MUS-01","name":"Aufstehen und Hinsetzen vom Stuhl (Sit-to-Stand)","instruktion":"Setzen Sie sich auf die vordere Hälfte des Stuhls und stellen Sie die Füße etwas hinter die Knie. Beugen Sie den Oberkörper mit geradem Rücken nach vorn, bis Ihre Nase über den Zehen ist. Stehen Sie dann aus beiden Beinen ganz auf und atmen Sie dabei aus. Setzen Sie sich langsam wieder hin, ohne sich fallen zu lassen. Nehmen Sie die Hände nur so viel zu Hilfe wie nötig.","dosis":"2-3S x 8-12W · 2 s aufstehen, 1 s stehen, 3 s hinsetzen · 2-3 x / Woche","kurz":"2-3S x 8-12W","hinweis":"Schwung holen und dabei nach hinten zurückfallen","bilder":[],"video":""},{"id":"ADL-AUF-KRA-MUS-02","name":"Schnell aufstehen, langsam hinsetzen (Power-Sit-to-Stand)","instruktion":"Setzen Sie sich wie gewohnt auf die vordere Hälfte des Stuhls. Stehen Sie so schnell auf, wie es sicher geht, und atmen Sie dabei aus. Bleiben Sie oben kurz ruhig stehen. Setzen Sie sich dann langsam wieder hin und zählen Sie dabei bis drei.","dosis":"2-3S x 6-10W · explosiv aufstehen (unter 1 s), 1 s stabilisieren, 3 s hinsetzen · 2-3 x / Woche","kurz":"2-3S x 6-10W","hinweis":"Tempo geht auf Kosten der Kontrolle (Schwanken im Stand)","bilder":[],"video":""},{"id":"ADL-BAL-KOO-NEU-01","name":"Gleichgewicht an der Küchenzeile: Füße zusammen, Semi-Tandem, Tandem, Einbeinstand","instruktion":"Stellen Sie sich vor die Küchenzeile und halten Sie die Hände knapp darüber, damit Sie sich jederzeit festhalten können. Stellen Sie die Füße eng zusammen und halten Sie diese Stellung. Wird das leicht, stellen Sie einen Fuß halb vor den anderen, später ganz vor den anderen wie auf einer Linie, zuletzt stehen Sie auf einem Bein. Halten Sie sich sofort fest, wenn Sie unsicher werden.","dosis":"je Stellung 3 x 10-30 s halten, bei Tandem und Einbeinstand Fuß wechseln · statisch halten, ruhig weiteratmen · täglich, zum Beispiel beim Warten auf den Wasserkocher","kurz":"je Stellung 3 x 10-30 s halten, bei Tandem und Einbeinstand Fuß wechseln","hinweis":"Üben ohne Festhaltemöglichkeit in Reichweite","bilder":[],"video":""},{"id":"ADL-BAL-KOO-NEU-02","name":"Gewichtsverlagerung und Greifen im Stand","instruktion":"Stellen Sie sich so hin, dass Sie sich jederzeit festhalten können. Verlagern Sie Ihr Gewicht langsam nach vorn, nach hinten und zur Seite, ohne die Füße zu bewegen. Greifen Sie dann nach einem Gegenstand, der etwas außerhalb Ihrer Reichweite liegt, und kommen Sie wieder aufrecht in die Mitte zurück. Die Füße bleiben dabei fest am Boden.","dosis":"2-3 Durchgänge x 8-10 Griffe je Richtung · langsam und kontrolliert, in der Endposition 2 s halten · täglich oder mindestens 3 x / Woche","kurz":"2-3 Durchgänge x 8-10 Griffe je Richtung","hinweis":"Greifen nur mit dem Arm ohne Gewichtsverlagerung","bilder":[],"video":""},{"id":"ADL-BOD-KOO-NEU-01","name":"Aufstehen vom Boden mit Rückwärtsverkettung","instruktion":"Wir üben das Aufstehen vom Boden von hinten nach vorn. Zuerst: Knien Sie vor dem Stuhl, stützen Sie beide Hände auf die Sitzfläche, stellen Sie das stärkere Bein auf und drücken Sie sich hoch. Drehen Sie sich um und setzen Sie sich. Später beginnen wir einen Schritt früher – im Vierfüßlerstand, im Seitsitz und zuletzt im Liegen. Üben Sie nur, wenn eine zweite Person im Raum ist.","dosis":"3-5 Wdh des aktuellen Teilschritts, 1-2 Durchgänge · langsam, jeder Teilschritt mit kurzer Pause · 1-2 x / Woche unter Anleitung, je 15-20 min","kurz":"3-5 Wdh des aktuellen Teilschritts, 1-2 Durchgänge","hinweis":"Zu viele Teilschritte auf einmal","bilder":[],"video":""},{"id":"ADL-DUA-KOO-NEU-01","name":"Gehen mit Doppelaufgabe (Rechnen, Aufzählen, Tragen)","instruktion":"Gehen Sie Ihre Übungsstrecke entlang und lösen Sie dabei eine Aufgabe: Zählen Sie zum Beispiel von 100 in Dreierschritten rückwärts, zählen Sie Städte oder Tiere auf oder tragen Sie einen Becher Wasser. Achten Sie einmal besonders auf sicheres Gehen, einmal besonders auf die Aufgabe. Bleiben Sie stehen, wenn es zu viel wird.","dosis":"3-5 Bahnen x 5-10 m je Aufgabe, 2-3 verschiedene Aufgaben, insgesamt 10-15 min · gewohntes Gehtempo, später zügig · 3 x / Woche","kurz":"3-5 Bahnen x 5-10 m je Aufgabe, 2-3 verschiedene Aufgaben, insgesamt 10-15 min","hinweis":"Aufgabe so schwer, dass das Gehen unsicher wird","bilder":[],"video":""},{"id":"ADL-GAN-KOO-NEU-01","name":"Gehen mit Richtungswechseln: Wenden, rückwärts, seitwärts, Fuß vor Fuß","instruktion":"Gehen Sie an der Küchenzeile oder im Flur entlang, damit Sie sich jederzeit festhalten können. Drehen Sie am Ende in einem kleinen Bogen um. Gehen Sie dann ein paar Schritte rückwärts, danach seitwärts und zuletzt Fuß vor Fuß wie auf einer Linie. Schauen Sie dabei nach vorn, nicht auf die Füße.","dosis":"je Variante 2-3 Bahnen x 3-5 m · langsam und kontrolliert, später zügig · täglich oder mindestens 3 x / Woche, zusätzlich regelmäßig spazieren gehen","kurz":"je Variante 2-3 Bahnen x 3-5 m","hinweis":"Drehen auf der Stelle statt im Bogen","bilder":[],"video":""},{"id":"ADL-GAN-KOO-NEU-02","name":"Große Schritte mit Taktgeber und Hinweisreizen (Parkinson)","instruktion":"Gehen Sie aufrecht mit großen Schritten und schwingen Sie die Arme kräftig mit. Setzen Sie zuerst die Ferse auf. Gehen Sie im Takt der Musik oder zählen Sie laut mit. Wenn die Füße am Boden „kleben“: Bleiben Sie stehen, verlagern Sie Ihr Gewicht, zählen Sie „eins, zwei“ und starten Sie mit einem großen Schritt. Drehen Sie in einem großen Bogen um.","dosis":"3-5 Bahnen x 5-10 m, insgesamt 10-15 min · rhythmisch im Takt, Schritte bewusst groß; Takt etwa im eigenen Gehtempo · täglich oder mindestens 3 x / Woche, dauerhaft","kurz":"3-5 Bahnen x 5-10 m, insgesamt 10-15 min","hinweis":"Schritte werden auf der Strecke wieder kleiner","bilder":[],"video":""},{"id":"ADL-TRA-KOO-NEU-01","name":"Aus dem Bett über die Seite aufstehen und auf einen Stuhl umsetzen","instruktion":"Stellen Sie die Beine an und drehen Sie sich im Ganzen auf die Seite. Schieben Sie die Beine über die Bettkante und drücken Sie sich mit den Armen hoch zum Sitzen. Bleiben Sie einen Moment sitzen und achten Sie darauf, ob Ihnen schwindelig ist. Stehen Sie erst auf, wenn Sie sich sicher fühlen. Drehen Sie sich mit kleinen Schritten, bis Sie den Stuhl hinten an beiden Beinen spüren. Fassen Sie beide Armlehnen und setzen Sie sich langsam hin.","dosis":"3-5 Durchgänge Bett – Stuhl – Bett · langsam, Teilschritte einzeln; im Sitz 30-60 s Pause vor dem Aufstehen · täglich; im Alltag bei jedem Aufstehen anwenden","kurz":"3-5 Durchgänge Bett – Stuhl – Bett","hinweis":"Aufstehen ohne Pause im Sitz","bilder":[],"video":""},{"id":"ADL-TRE-KOO-NEU-01","name":"Treppe mit Nachstellschritt („mit dem Guten hinauf, mit dem Schlechten hinab“)","instruktion":"Halten Sie sich immer am Geländer fest. Hinauf: Stellen Sie zuerst das stärkere Bein auf die Stufe, dann das schwächere dazu. Hinunter: Stellen Sie zuerst das schwächere Bein eine Stufe tiefer, dann das stärkere dazu. Merksatz: Mit dem Guten hinauf, mit dem Schlechten hinab. Nehmen Sie jede Stufe einzeln und ohne Eile.","dosis":"2-3 Durchgänge x 3-5 Stufen hinauf und hinunter · langsam, jede Stufe einzeln im Nachstellschritt · täglich, bis der Ablauf sitzt; danach bei jeder Treppe anwenden","kurz":"2-3 Durchgänge x 3-5 Stufen hinauf und hinunter","hinweis":"Hinauf mit dem schwächeren Bein zuerst","bilder":[],"video":""},{"id":"ADL-TRE-KRA-MUS-01","name":"Aufsteigen auf eine Stufe (Step-up) mit Handlauf","instruktion":"Halten Sie sich mit einer Hand am Geländer fest. Stellen Sie einen Fuß ganz auf die Stufe und steigen Sie mit diesem Bein hinauf, bis es gestreckt ist. Stellen Sie das andere Bein dazu. Steigen Sie langsam rückwärts wieder hinunter. Das Knie bleibt dabei über den Zehen.","dosis":"2-3S x 8-12W je Bein · 2 s hinauf, 2-3 s hinunter · 2-3 x / Woche","kurz":"2-3S x 8-12W je Bein","hinweis":"Hochziehen am Geländer statt aus dem Bein","bilder":[],"video":""},{"id":"BWS-EXS-KRA-MUS-01","name":"Exspiratorische Kräftigung, Lippenbremse mit aktiver Ausatmung","instruktion":"Atme normal durch die Nase ein und dann durch leicht gespitzte Lippen langsam aus, wie durch einen Strohhalm. Zieh dabei deinen Bauch aktiv nach innen.","dosis":"3S x 8-10 Atemzüge · Einatmung ca. 2-3 s, aktive Ausatmung 6-8 s · täglich","kurz":"3S x 8-10 Atemzüge","hinweis":"zu schnelle oder forcierte Ausatmung mit Pressen, Anspannung im Nacken statt im Bauch","bilder":[],"video":""},{"id":"BWS-EXT-KRA-MUS-01","name":"Rückenstreckerkräftigung BWS, Y-T-W in Bauchlage","instruktion":"Heb deine Arme in der Y-, dann T-, dann W-Stellung ein kleines Stück vom Boden ab und halte kurz, dann senk sie wieder ab.","dosis":"3S x 8-10W je Armstellung · 2 s hoch, 1 s halten, 2 s runter · 2-3 x / Woche","kurz":"3S x 8-10W je Armstellung","hinweis":"Überstreckung der Halswirbelsäule, zu große Anhebehöhe mit Schwung, Kompensation über den oberen Trapezius","bilder":[],"video":""},{"id":"BWS-EXT-MOB-KRP-01","name":"Brustwirbelsäulen-Extensionsmobilisation über die Schaumstoffrolle","instruktion":"Leg die Rolle quer unter deinen oberen Rücken und lass dich langsam darüber nach hinten sinken, bis du eine Dehnung spürst. Dann wieder vorsichtig aufrichten.","dosis":"3S x 8-10 Wiederholungen, an verschiedenen Segmenten der BWS · langsam, ca. 3 s pro Richtung · 3-5 x / Woche","kurz":"3S x 8-10 Wiederholungen, an verschiedenen Segmenten der BWS","hinweis":"Überstreckung der Halswirbelsäule statt Kopf mit den Händen zu stützen, zu harte oder zu dünne Rolle, Rolle im unteren Rücken statt in der BWS positioniert","bilder":[],"video":""},{"id":"BWS-FLX-DEH-MUS-01","name":"Sitzende Vorbeuge mit Fokus Brustwirbelsäule","instruktion":"Lass deinen Oberkörper mit rundem Rücken langsam nach vorne unten sinken, die Arme hängen locker, bis es im mittleren Rücken zieht.","dosis":"3 x 30-45 s · statisch · täglich","kurz":"3 x 30-45 s","hinweis":"Ausweichen über die LWS statt der BWS, zu forsches Nachuntensinken","bilder":[],"video":""},{"id":"BWS-FLX-MOB-KRP-01","name":"Katze-Kuh, Flexionsanteil (thorakale Mobilisation)","instruktion":"Mach einen Katzenbuckel und schau dabei Richtung Bauchnabel - versuch, die Rundung besonders zwischen deinen Schulterblättern zu spüren, nicht nur im unteren Rücken.","dosis":"3S x 10-15 Wiederholungen · langsam, ca. 3 s pro Richtung · täglich","kurz":"3S x 10-15 Wiederholungen","hinweis":"Bewegung kommt nur aus der Lendenwirbelsäule, BWS bleibt starr, zu schnelles Tempo","bilder":[],"video":""},{"id":"BWS-INS-KRA-MUS-01","name":"Flankenatmung gegen Widerstand","instruktion":"Atme tief in deine Flanken, dort wo deine Hände liegen, und spür, wie sich dein Brustkorb gegen deine Hände weitet. Gib dabei mit den Händen einen sanften Gegendruck. Dann langsam wieder ausatmen.","dosis":"3S x 8-10 Atemzüge · langsam, ca. 4 s einatmen, 6 s ausatmen · täglich","kurz":"3S x 8-10 Atemzüge","hinweis":"Hochziehen der Schultern statt Weitung des Brustkorbs, zu schnelle Atmung, Pressen statt sanftem Gegendruck","bilder":[],"video":""},{"id":"BWS-INS-MOB-BAN-01","name":"Rippenmobilisation über Arm-Overhead-Atemzug","instruktion":"Heb beim Einatmen beide Arme langsam über deinen Kopf und atme dabei bewusst tief in deinen Brustkorb, beim Ausatmen senk die Arme wieder.","dosis":"3S x 8-10 Wiederholungen · an den Atemrhythmus gekoppelt, ca. 4 s Einatmung, 4-6 s Ausatmung · täglich","kurz":"3S x 8-10 Wiederholungen","hinweis":"Bewegung schneller als der Atemrhythmus, Hohlkreuz beim Anheben der Arme","bilder":[],"video":""},{"id":"BWS-LFX-DEH-MUS-01","name":"Seitliche BWS-Dehnung im Vierfüßlerstand","instruktion":"Führ deinen Ellbogen langsam unter deinem Körper hindurch Richtung der anderen Hand, bis es seitlich an deinem Rumpf zieht, dann wieder zurück.","dosis":"3S x 8-10W je Seite · langsam, ca. 3 s pro Richtung · 2-3 x / Woche","kurz":"3S x 8-10W je Seite","hinweis":"Ausweichen über das Becken statt reiner BWS-Bewegung, zu forsches Durchdrehen","bilder":[],"video":""},{"id":"BWS-ROT-DEH-MUS-01","name":"Open Book – Rotationsdehnung in Seitlage","instruktion":"Öffne deinen oberen Arm wie ein Buch zur anderen Seite, dein Blick folgt der Hand, und lass deinen Brustkorb sich mit öffnen. Deine Knie bleiben dabei liegen.","dosis":"3 x 20-30 s je Seite, alternativ 3S x 8-10 dynamische Wiederholungen · langsam, statisch oder fließend · täglich","kurz":"3 x 20-30 s je Seite, alternativ 3S x 8-10 dynamische Wiederholungen","hinweis":"Knie heben ab, zu forsches Öffnen, Ausweichen über das Becken","bilder":[],"video":""},{"id":"BWS-ROT-KRA-MUS-01","name":"Rotationskräftigung im Sitz gegen Widerstand","instruktion":"Dreh deinen Oberkörper gegen das Band zur Seite, dein Becken bleibt dabei ruhig auf dem Stuhl sitzen, dann langsam wieder zurück.","dosis":"3S x 10-12W je Seite · 2 s hin, 2 s zurück · 2-3 x / Woche","kurz":"3S x 10-12W je Seite","hinweis":"Mitdrehen des Beckens statt isolierter BWS-Rotation, Schwungholen","bilder":[],"video":""},{"id":"BWS-ROT-MOB-KRP-01","name":"Rotationsmobilisation im Vierfüßlerstand (Thread the Needle)","instruktion":"Dreh deinen Ellbogen nach oben Richtung Decke, dein Blick folgt der Hand, dann dreh in die andere Richtung unter deinem Körper hindurch. Dein Becken bleibt dabei ruhig.","dosis":"3S x 8-10 Wiederholungen je Seite · langsam, ca. 3 s pro Richtung · täglich","kurz":"3S x 8-10 Wiederholungen je Seite","hinweis":"Bewegung aus dem Becken statt aus der BWS, zu schnelles Tempo","bilder":[],"video":""},{"id":"ELL-EXT-DEH-MUS-01","name":"Trizepsdehnung über Kopf","instruktion":"Führ deine Hand hinter den Nacken und drück mit der anderen Hand deinen Ellbogen sanft weiter nach hinten, bis es hinten am Oberarm zieht.","dosis":"3 x 20-30 s je Seite · statisch · täglich","kurz":"3 x 20-30 s je Seite","hinweis":"zu starker Druck, Ausweichen ins Hohlkreuz","bilder":[],"video":""},{"id":"ELL-EXT-KRA-MUS-01","name":"Ellenbogenextension Kräftigung, Trizeps am Band","instruktion":"Streck deinen Unterarm gegen das Band nach oben, bis dein Arm ganz gerade ist, und lass ihn dann langsam wieder zurück.","dosis":"3S x 10-15W · 2 s strecken, 2 s beugen · 2-3 x / Woche","kurz":"3S x 10-15W","hinweis":"Ellbogen wandert nach vorne/außen, Schwungholen aus der Schulter","bilder":[],"video":""},{"id":"ELL-EXT-KRA-MUS-02","name":"Dips am Barren","instruktion":"Stütz dich mit gestreckten Armen am Barren ab und zieh die Schultern nach unten. Senk dich langsam ab, bis deine Oberarme etwa waagerecht sind, die Ellbogen zeigen nach hinten. Drück dich wieder hoch. Geh nicht tiefer, wenn es vorn in der Schulter drückt.","dosis":"3S x 6-12W · 2-3 s ablassen, 1-2 s drücken · 2 x / Woche","kurz":"3S x 6-12W","hinweis":"Zu tief, die Schultern rollen nach vorn","bilder":[],"video":""},{"id":"ELL-EXT-KRA-MUS-03","name":"Liegendes Trizepsdrücken mit SZ-Stange oder Kurzhanteln (French Press)","instruktion":"Leg dich auf die Bank und halt die Stange mit gestreckten Armen über der Brust. Beug nur die Ellbogen und senk die Stange langsam Richtung Stirn ab. Deine Oberarme bleiben dabei ruhig. Streck die Arme dann wieder.","dosis":"3S x 10-12W · 3 s ablassen, 2 s strecken · 2 x / Woche","kurz":"3S x 10-12W","hinweis":"Oberarme wandern mit, die Übung wird zum Drücken","bilder":[],"video":""},{"id":"ELL-EXT-KRA-SEH-01","name":"Isometrische Handgelenksextension (Tennisellenbogen, Stufe 1)","instruktion":"Drück dein Handgelenk mit der Handfläche nach unten gegen einen Widerstand nach oben und halte die Spannung ruhig.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, konstante Spannung · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Ellbogen wird mitbewegt, zu hohe Intensität am Anfang, Handgelenk in Ulnar-/Radialabweichung statt neutral","bilder":[],"video":""},{"id":"ELL-EXT-KRA-SEH-02","name":"Exzentrische Handgelenksextension (Tennisellenbogen, Stufe 2)","instruktion":"Streck dein Handgelenk mit dem Gewicht nach oben, mit Hilfe der anderen Hand oder aktiv, und lass es dann ganz langsam von allein nach unten sinken.","dosis":"3-4S x 6-15W, Last nach Wochenplan steigern: Woche 1 = 15RM, Woche 2-3 = 12RM, Woche 4-5 = 10RM, Woche 6-8 = 8RM, Woche 9-12 = 6RM · langsame exzentrische Phase 3-4 s, konzentrische Phase erleichtert/unterstützt · 3 x / Woche, mindestens 48 h Abstand","kurz":"3-4S x 6-15W, Last nach Wochenplan steigern: Woche 1 = 15RM, Woche 2-3 = 12RM, Woche 4-5 = 10RM, Woche 6-8 = 8RM, Woche 9-12 = 6RM","hinweis":"konzentrische Phase auch mit der betroffenen Seite kraftvoll ausgeführt statt entlastet, zu schnelles Absenken, zu leichte Last","bilder":[],"video":""},{"id":"ELL-EXT-KRA-SEH-03","name":"Isometrische Ellenbogenstreckung gegen die Tischplatte (Trizepssehne)","instruktion":"Setz dich seitlich an einen Tisch. Dein Oberarm hängt am Körper, der Ellbogen ist gebeugt und die Faust liegt mit der Kleinfingerseite auf der Tischplatte. Drück die Faust nach unten in den Tisch, als wolltest du den Arm strecken - dabei bewegt sich nichts. Halte die Spannung ruhig und atme weiter.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Abstützen mit dem Körpergewicht statt Druck aus dem Arm","bilder":[],"video":""},{"id":"ELL-EXT-MOB-KRP-01","name":"Sanfte zyklische Ellenbogenmobilisation","instruktion":"Beweg deinen Unterarm locker auf und ab, wie ein sanftes Pendeln, ohne Kraft aufzuwenden.","dosis":"3S x 15-20 Wiederholungen · langsam, ca. 2-3 s pro Richtung · täglich, bei Reizzustand mehrmals täglich kurz","kurz":"3S x 15-20 Wiederholungen","hinweis":"zu schnelles Tempo, endgradiges Einrasten an den Bewegungsenden","bilder":[],"video":""},{"id":"ELL-FLX-DEH-MUS-01","name":"Dehnung der Ellenbogenflexoren (Bizeps/Brachialis)","instruktion":"Streck deinen Arm nach hinten aus, dreh die Handfläche nach oben und knick das Handgelenk sanft nach hinten, bis es vorne am Oberarm zieht.","dosis":"3 x 20-30 s je Seite · statisch · täglich","kurz":"3 x 20-30 s je Seite","hinweis":"zu starker Zug, Ausweichen über die Schulter","bilder":[],"video":""},{"id":"ELL-FLX-KOO-BAN-01","name":"Propriozeptive Valguskontrolle für die Wurfbewegung","instruktion":"Mach eine langsame, kontrollierte Wurfbewegung und achte darauf, dass dein Ellbogen dabei nicht nach innen wegknickt.","dosis":"3S x 10-12 Wiederholungen · zunächst langsam-kontrolliert, später zügiger · 2-3 x / Woche","kurz":"3S x 10-12 Wiederholungen","hinweis":"Einknicken des Ellbogens nach innen (Valgus) wird nicht bemerkt oder korrigiert, zu schnelle Steigerung der Geschwindigkeit","bilder":[],"video":""},{"id":"ELL-FLX-KOO-SON-01","name":"Neurodynamik N. ulnaris – Slider","instruktion":"Streck deinen Arm und deine Finger gleichzeitig, dann beug den Ellbogen und die Finger gleichzeitig wieder - eine fließende Bewegung, kein Halten in der Endposition.","dosis":"3S x 10 Wiederholungen · fließend, ca. 2-3 s pro Richtung · mehrmals täglich, kurze Serien","kurz":"3S x 10 Wiederholungen","hinweis":"endgradiges Kombinieren aller Komponenten gleichzeitig (wird zum Tensioner statt Slider), Symptome werden bewusst provoziert und gehalten","bilder":[],"video":""},{"id":"ELL-FLX-KRA-MUS-01","name":"Ellenbogenflexion Kräftigung, Bizeps Curl","instruktion":"Beug deinen Arm gegen den Widerstand nach oben, dein Ellbogen bleibt dabei am Körper, dann senk ihn langsam wieder ab.","dosis":"3S x 10-15W · 2 s hoch, 2 s runter · 2-3 x / Woche","kurz":"3S x 10-15W","hinweis":"Schwungholen mit dem Oberkörper, Ellbogen wandert nach vorne, unvollständige Bewegungsamplitude","bilder":[],"video":""},{"id":"ELL-FLX-KRA-MUS-02","name":"Hammercurl mit Kurzhanteln (Neutralgriff)","instruktion":"Halt die Hanteln seitlich, die Daumen zeigen nach vorn. Beug die Ellbogen und heb die Hanteln bis zur Schulter, ohne die Hände zu drehen. Die Oberarme bleiben am Körper. Lass die Hanteln langsam wieder sinken.","dosis":"3S x 10-12W · 2 s beugen, 3 s ablassen · 2 x / Woche","kurz":"3S x 10-12W","hinweis":"Schwung aus dem Rücken","bilder":[],"video":""},{"id":"ELL-FLX-KRA-SEH-01","name":"Isometrische Belastung des Flexoren-Pronatoren-Ursprungs (Golferellenbogen, Stufe 1)","instruktion":"Drück dein Handgelenk mit der Handfläche nach oben gegen einen Widerstand und halte die Spannung ruhig.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, konstante Spannung · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Ellbogen wird mitbewegt statt isoliert am Handgelenk zu arbeiten, zu hohe Intensität am Anfang","bilder":[],"video":""},{"id":"ELL-FLX-KRA-SEH-02","name":"Heavy Slow Resistance Handgelenksflexion (Golferellenbogen, Stufe 2)","instruktion":"Beug dein Handgelenk langsam mit dem Gewicht nach oben und lass es dann genauso langsam wieder nach unten sinken.","dosis":"3-4S x 6-15W, Last nach Wochenplan steigern: Woche 1 = 15RM, Woche 2-3 = 12RM, Woche 4-5 = 10RM, Woche 6-8 = 8RM, Woche 9-12 = 6RM · 3 s konzentrisch - 1 s halten - 3 s exzentrisch · 3 x / Woche, mindestens 48 h Abstand","kurz":"3-4S x 6-15W, Last nach Wochenplan steigern: Woche 1 = 15RM, Woche 2-3 = 12RM, Woche 4-5 = 10RM, Woche 6-8 = 8RM, Woche 9-12 = 6RM","hinweis":"Mitbewegung des Ellbogens, zu schnelles Tempo, zu leichte Last","bilder":[],"video":""},{"id":"ELL-FLX-KRA-SEH-03","name":"Exzentrisch betonte Bizeps-Curls mit Supination (distale Bizepssehne, Stufe 2)","instruktion":"Heb die Hantel mit der Handfläche nach oben an und lass sie dann ganz langsam wieder sinken - das Absenken dauert etwa doppelt so lange wie das Heben. Deine Handfläche bleibt dabei immer nach oben gedreht.","dosis":"3-4S x 6-15W nach Wochenprogression wie bei anderen Sehnen (15RM bis 6RM über mehrere Wochen) · 2 s konzentrisch / 4 s exzentrisch (exzentrisch betont) · 3 x / Woche mit mindestens 48 h Abstand","kurz":"3-4S x 6-15W nach Wochenprogression wie bei anderen Sehnen (15RM bis 6RM über mehrere Wochen)","hinweis":"Unterarm dreht während der Übung in Richtung Pronation statt supiniert zu bleiben, ruckartiges Abbremsen der exzentrischen Phase, zu schwere Last von Beginn an","bilder":[],"video":""},{"id":"ELL-FLX-KRA-SEH-04","name":"Isometrische Ellenbogenbeugung mit Supination gegen die Tischplatte (distale Bizepssehne)","instruktion":"Setz dich an einen stabilen Tisch. Dein Ellbogen ist gebeugt und liegt am Körper, die Handfläche zeigt nach oben und liegt von unten an der Tischplatte. Drück die Hand nach oben gegen den Tisch - dabei bewegt sich nichts. Halte die Spannung ruhig und atme weiter. Die Schulter bleibt locker unten.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Tisch zu leicht und hebt sich an","bilder":[],"video":""},{"id":"ELL-PRO-DEH-MUS-01","name":"Dehnung der Pronatoren in Supination","instruktion":"Streck deinen Arm nach vorne, Handfläche nach oben, und dreh deinen Unterarm mit der anderen Hand sanft weiter, bis es zieht.","dosis":"3 x 20-30 s je Seite · statisch · täglich","kurz":"3 x 20-30 s je Seite","hinweis":"zu starker Zug, Mitbewegung der Schulter","bilder":[],"video":""},{"id":"ELL-PRO-KRA-MUS-01","name":"Pronationskräftigung gegen Widerstand","instruktion":"Dreh deinen Unterarm gegen den Widerstand, sodass deine Handfläche nach unten zeigt, dann langsam wieder zurück.","dosis":"3S x 12-15W je Seite · 2 s hin, 2 s zurück · 2-3 x / Woche","kurz":"3S x 12-15W je Seite","hinweis":"Mitbewegung des Ellbogens oder der Schulter statt isolierter Unterarmrotation","bilder":[],"video":""},{"id":"ELL-PRO-KRA-SEH-01","name":"Isometrische Pronation gegen Widerstand (Flexoren-Pronatoren-Ursprung, Wurfarm)","instruktion":"Setz dich an einen Tisch und leg deinen Unterarm ab, der Daumen zeigt nach oben. Deine andere Hand liegt von oben auf der Daumenseite. Versuch, die Hand nach innen zu drehen, so dass die Handfläche Richtung Tisch zeigt - die andere Hand hält dagegen, es bewegt sich nichts. Halte die Spannung ruhig und atme weiter.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Oberarm und Schulter drehen mit statt nur der Unterarm","bilder":[],"video":""},{"id":"ELL-SUP-DEH-MUS-01","name":"Dehnung von Supinator und Bizeps in Pronation","instruktion":"Streck deinen Arm nach vorne und dreh deinen Unterarm mit der anderen Hand sanft weiter, bis dein Handrücken möglichst weit nach oben zeigt und es zieht.","dosis":"3 x 20-30 s je Seite · statisch · täglich","kurz":"3 x 20-30 s je Seite","hinweis":"zu starker Zug, Mitbewegung der Schulter","bilder":[],"video":""},{"id":"ELL-SUP-KRA-MUS-01","name":"Supinationskräftigung gegen Widerstand","instruktion":"Dreh deinen Unterarm gegen den Widerstand, sodass deine Handfläche nach oben zeigt, dann langsam wieder zurück.","dosis":"3S x 12-15W je Seite · 2 s hin, 2 s zurück · 2-3 x / Woche","kurz":"3S x 12-15W je Seite","hinweis":"Mitbewegung des Ellbogens oder der Schulter statt isolierter Unterarmrotation","bilder":[],"video":""},{"id":"FIN-D1I-KRA-MUS-01","name":"Daumenendgelenk Beweglichkeit und Kräftigung","instruktion":"Halt dein Daumengrundgelenk mit der anderen Hand fest und beweg nur die Daumenspitze auf und ab.","dosis":"3S x 10-12W · 2 s pro Richtung · täglich","kurz":"3S x 10-12W","hinweis":"Grundgelenk bewegt mit statt isoliert das Endgelenk zu bewegen","bilder":[],"video":""},{"id":"FIN-D1M-KOO-BAN-01","name":"Daumen-MCP-Kollateralband-Stabilität (Skidaumen-Nachbehandlung)","instruktion":"Führ deinen Daumen aktiv gegen einen leichten Widerstand zum Zeigefinger, wie beim Greifen, und achte darauf, dass dein Daumengrundgelenk dabei stabil bleibt und nicht seitlich wegknickt.","dosis":"3S x 10-12 Wiederholungen · kontrolliert, 2 s pro Richtung · 2-3 x / Woche","kurz":"3S x 10-12 Wiederholungen","hinweis":"seitliches Aufklappen des Grundgelenks wird nicht bemerkt, zu frühe Belastung ohne vorherige ärztliche Freigabe/Bildgebung","bilder":[],"video":""},{"id":"FIN-D1M-KRA-MUS-01","name":"Daumengrundgelenk Flexion/Extension Kräftigung","instruktion":"Beug und streck dein Daumengrundgelenk gegen einen leichten Widerstand.","dosis":"3S x 12-15W · 2 s pro Richtung · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"Mitbewegung des Sattelgelenks statt isolierter Grundgelenksbewegung","bilder":[],"video":""},{"id":"FIN-D1P-KRA-KRP-01","name":"Gelenkschonendes Bewegungs- und Krafttraining bei Rhizarthrose","instruktion":"Beweg deinen Daumen langsam in großen, weichen Kreisen und drück dabei nur ganz leicht gegen einen weichen Ball. Vermeide festen, spitzen Zugriff wie beim Öffnen eines Glases.","dosis":"3S x 10-15 Wiederholungen, leichte Kraftkomponente · langsam, ca. 3-4 s pro Bewegungsbogen · täglich","kurz":"3S x 10-15 Wiederholungen, leichte Kraftkomponente","hinweis":"spitzer, kraftvoller Zangengriff (belastet das Gelenk stark), zu schnelle oder ruckartige Bewegung","bilder":[],"video":""},{"id":"FIN-D1P-KRA-MUS-01","name":"Daumen-Palmarabduktion Kräftigung","instruktion":"Führ deinen Daumen gegen das Band von der Handfläche weg nach oben, dann langsam wieder zurück.","dosis":"3S x 12-15W · 2 s hin, 2 s zurück · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"Mitbewegung des Handgelenks, zu starkes Band","bilder":[],"video":""},{"id":"FIN-D1R-DEH-MUS-01","name":"Daumensattelgelenk-Mobilisation in Radialabduktion","instruktion":"Zieh deinen Daumen mit der anderen Hand sanft flach auf dem Tisch vom Zeigefinger weg, bis es an der Daumenbasis zieht.","dosis":"3 x 20-30 s · statisch, sanft · täglich","kurz":"3 x 20-30 s","hinweis":"zu starker Zug, ruckartige Bewegung","bilder":[],"video":""},{"id":"FIN-DIP-KRA-MUS-01","name":"Isolierte DIP-Beweglichkeit (Blocking Exercise)","instruktion":"Halt dein mittleres Fingergelenk mit der anderen Hand fest gerade und beweg nur die Fingerspitze auf und ab.","dosis":"3S x 10-12W je Finger · 2 s beugen, 2 s strecken · täglich","kurz":"3S x 10-12W je Finger","hinweis":"Mittelgelenk wird nicht sauber fixiert und bewegt mit","bilder":[],"video":""},{"id":"FIN-DIP-KRA-SEH-01","name":"Mallet-Finger-Nachbehandlung (Terminalstrecksehne)","instruktion":"Solange die Schiene verordnet ist, bleibt dein Fingerendglied konsequent gerade - auch beim Waschen die Schiene nicht abnehmen, ohne das Gelenk zu stützen. Erst nach Freigabe durch die Behandlung beginnen wir mit vorsichtigen Bewegungen.","dosis":"nach Freigabe: 3S x 10 Wiederholungen, kleine Amplitude · sehr langsam und kontrolliert · täglich, nach Freigabe","kurz":"nach Freigabe: 3S x 10 Wiederholungen, kleine Amplitude","hinweis":"Schiene wird zwischendurch abgenommen und das Gelenk beugt sich dabei unbemerkt (Behandlung beginnt dann von vorne!), zu frühe aktive Beugung vor Freigabe","bilder":[],"video":""},{"id":"FIN-M2A-KRA-MUS-01","name":"Fingerspreizen Kräftigung (Interossei)","instruktion":"Spreiz deine Finger gegen das Gummiband auseinander, halte kurz und führ sie dann langsam wieder zusammen.","dosis":"3S x 12-15W · 2 s spreizen, 2 s zusammenführen · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"Mitbewegung im Handgelenk, zu starkes Band","bilder":[],"video":""},{"id":"FIN-M2E-DEH-MUS-01","name":"Dehnung der Fingerstrecker in Faustposition","instruktion":"Mach eine Faust und drück sie mit der anderen Hand sanft weiter zusammen, bis es am Handrücken zieht.","dosis":"3 x 20-30 s · statisch · täglich","kurz":"3 x 20-30 s","hinweis":"zu starker Druck, zu schnelle Bewegung","bilder":[],"video":""},{"id":"FIN-M2E-KRA-MUS-01","name":"MCP-Extension Kräftigung, Fingerstreckung gegen Band","instruktion":"Streck und spreiz deine Finger gegen das Gummiband, halte kurz und lass dann locker.","dosis":"3S x 12-15W · 2 s strecken, 2 s lösen · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"zu starkes Band von Beginn an, Überstreckung der Grundgelenke erzwingen","bilder":[],"video":""},{"id":"FIN-M2F-KRA-MUS-01","name":"MCP-Flexion Kräftigung, Faustschluss gegen Widerstand","instruktion":"Umschließ den Ball mit deinen Fingern und drück ihn zusammen, indem du hauptsächlich im Grundgelenk beugst, die Fingerspitzen bleiben dabei möglichst gerade.","dosis":"3S x 12-15W · 2 s zudrücken, 2 s lösen · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"Bewegung verlagert sich in die Fingerendgelenke statt im Grundgelenk zu bleiben, zu harter Widerstand von Beginn an","bilder":[],"video":""},{"id":"FIN-M2F-KRA-SEH-01","name":"Belastungsaufbau A1-Ringband (schnellender Finger)","instruktion":"Beug deinen Finger ganz langsam, bis kurz bevor er schnappen würde, und geh dann wieder zurück. Steigere die Beugung nur so weit, wie es ohne Schnappen und ohne starken Schmerz geht.","dosis":"3S x 10 Wiederholungen · sehr langsam, ca. 3-4 s pro Richtung · mehrmals täglich, kurze Serien","kurz":"3S x 10 Wiederholungen","hinweis":"forciertes Durchdrücken durch den schnappenden Punkt, zu schnelle Bewegung","bilder":[],"video":""},{"id":"FIN-OPP-KOO-MUS-01","name":"Feinmotoriktraining Opposition, Kleinteile aufnehmen","instruktion":"Nimm die kleinen Gegenstände einzeln mit wechselnden Fingerkombinationen auf und leg sie in ein Gefäß - erst in Ruhe, dann zunehmend flott.","dosis":"3S x 1-2 min · zunehmend zügig, aber kontrolliert · täglich","kurz":"3S x 1-2 min","hinweis":"grobmotorisches Greifen mit der ganzen Hand statt gezielter Fingerkombination, zu schnelles Tempo ohne saubere Ausführung","bilder":[],"video":""},{"id":"FIN-OPP-KRA-MUS-01","name":"Opposition Kräftigung, Daumen-Kleinfinger-Kontakt gegen Widerstand","instruktion":"Führ deinen Daumen und deinen kleinen Finger gegen das Band zusammen, bis sich die Spitzen berühren, halte kurz und lös dann wieder.","dosis":"3S x 12-15W · 2 s hin, 2 s zurück · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"Mitbewegung des Handgelenks, zu starkes Band","bilder":[],"video":""},{"id":"FIN-PIP-DEH-MUS-01","name":"Sanfte Streckmobilisation bei PIP-Beugekontraktur","instruktion":"Drück dein Fingermittelgelenk mit der anderen Hand ganz sanft, aber über längere Zeit in Richtung Streckung - lieber schwach und lang als kurz und kräftig.","dosis":"3-5 x 2-5 min · statisch, sehr sanfter, konstanter Druck · täglich","kurz":"3-5 x 2-5 min","hinweis":"zu kräftiger, kurzer Druck (erhöht Entzündungsreiz und Kontrakturrisiko), Ungeduld mit zu schneller Progression","bilder":[],"video":""},{"id":"FIN-PIP-KOO-BAN-01","name":"Nachbehandlung PIP-Kollateralband ('Jammed Finger')","instruktion":"Beug und streck deinen Finger aktiv, so weit es schmerzfrei geht, und achte darauf, dass er dabei gerade bleibt und nicht seitlich wegknickt.","dosis":"3S x 10-15 Wiederholungen · kontrolliert, 2 s pro Richtung · täglich","kurz":"3S x 10-15 Wiederholungen","hinweis":"seitliches Abweichen wird nicht bemerkt, zu frühe volle Sportbelastung ohne Schutz","bilder":[],"video":""},{"id":"FIN-PIP-KRA-MUS-01","name":"Isolierte PIP-Beweglichkeit (Blocking Exercise)","instruktion":"Halt dein Fingergrundgelenk mit der anderen Hand fest gerade und beweg nur das mittlere Fingergelenk auf und ab.","dosis":"3S x 10-12W je Finger · 2 s beugen, 2 s strecken · täglich","kurz":"3S x 10-12W je Finger","hinweis":"Grundgelenk wird nicht sauber fixiert und bewegt mit, forcierte Bewegung in eine steife Richtung","bilder":[],"video":""},{"id":"HAG-DEX-DEH-MUS-01","name":"Dehnung der Handgelenksstrecker","instruktion":"Streck deinen Arm nach vorne, lass die Hand nach unten fallen und zieh sie mit der anderen Hand sanft weiter zu dir, bis es am Handrücken zieht.","dosis":"3 x 20-30 s je Seite · statisch · täglich","kurz":"3 x 20-30 s je Seite","hinweis":"zu starker Zug, Ellbogen wird gebeugt statt gestreckt zu bleiben","bilder":[],"video":""},{"id":"HAG-DEX-KOO-SON-01","name":"Neurodynamik N. medianus – Slider","instruktion":"Streck dein Handgelenk und deine Finger und neig gleichzeitig deinen Kopf zur anderen Seite, dann beug beides wieder und neig den Kopf zurück - eine fließende Bewegung, kein Ziehen und Halten.","dosis":"3S x 10 Wiederholungen · fließend, ca. 2-3 s pro Richtung · mehrmals täglich, kurze Serien","kurz":"3S x 10 Wiederholungen","hinweis":"endgradiges Kombinieren aller Komponenten gleichzeitig (wird zum Tensioner statt Slider), zu forsches Dehnen","bilder":[],"video":""},{"id":"HAG-DEX-KRA-KNO-01","name":"Gewichttragende Stützbelastung über das Handgelenk","instruktion":"Stütz dich mit flachen Händen ab und verlager dein Körpergewicht kontrolliert nach vorne auf die Hände, dann wieder zurück.","dosis":"3S x 10-15W · 2 s vor, 2 s zurück · 2-3 x / Woche","kurz":"3S x 10-15W","hinweis":"zu große Belastung von Beginn an, endgradige schmerzhafte Handgelenksstreckung erzwingen","bilder":[],"video":""},{"id":"HAG-DEX-KRA-MUS-01","name":"Handgelenksstrecker Kräftigung","instruktion":"Heb deine Hand gegen den Widerstand nach oben und lass sie dann langsam wieder sinken.","dosis":"3S x 12-15W · 2 s hoch, 2 s runter · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"Mitbewegung des Ellbogens, zu große Last mit Schwung","bilder":[],"video":""},{"id":"HAG-PFL-DEH-MUS-01","name":"Dehnung der Handgelenksbeuger","instruktion":"Streck deinen Arm nach vorne, Handfläche nach oben, Finger zeigen nach unten, und zieh die Hand mit der anderen Hand sanft weiter, bis es an der Innenseite zieht.","dosis":"3 x 20-30 s je Seite · statisch · täglich","kurz":"3 x 20-30 s je Seite","hinweis":"zu starker Zug, Ellbogen wird gebeugt statt gestreckt zu bleiben","bilder":[],"video":""},{"id":"HAG-PFL-KRA-MUS-01","name":"Handgelenksbeuger Kräftigung","instruktion":"Heb deine Hand gegen den Widerstand nach oben und lass sie dann langsam wieder sinken.","dosis":"3S x 12-15W · 2 s hoch, 2 s runter · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"Mitbewegung des Ellbogens, zu große Last mit Schwung","bilder":[],"video":""},{"id":"HAG-RAB-DEH-MUS-01","name":"Dehnung der Daumenabduktoren/-strecker (Strecksehnenfach 1)","instruktion":"Schlag deinen Daumen in die Handfläche ein und die Finger locker darüber, dann führ dein Handgelenk sanft zur kleinen Fingerseite hin, bis es über dem Daumen-Handgelenk-Bereich zieht.","dosis":"3 x 15-20 s je Seite · statisch, sehr sanft · 2-3 x / Woche","kurz":"3 x 15-20 s je Seite","hinweis":"zu starker Zug, zu lange Haltezeit, Anwendung trotz akuter Reizung","bilder":[],"video":""},{"id":"HAG-RAB-KRA-SEH-01","name":"Daumenabspreizen gegen leichten Bandwiderstand (De Quervain, Stufe 2)","instruktion":"Leg deinen Unterarm auf den Tisch, das Handgelenk bleibt gerade. Spreiz deinen Daumen langsam gegen das leichte Band ab und führ ihn genauso langsam zurück. Dein Handgelenk knickt dabei nicht zur Seite ab.","dosis":"3S x 10-15W mit sehr leichtem Widerstand · 2 s hin, 2 s zurück · 2-3 x / Woche","kurz":"3S x 10-15W mit sehr leichtem Widerstand","hinweis":"Handgelenk weicht in Ulnarabweichung aus (komprimiert die Sehnen zusätzlich im Fach), zu schnelle Steigerung der Last","bilder":[],"video":""},{"id":"HAG-RAB-KRA-SEH-02","name":"Isometrisches Daumenabspreizen gegen die andere Hand (De Quervain, Stufe 1)","instruktion":"Leg deinen Unterarm auf den Tisch, dein Handgelenk bleibt gerade. Leg zwei Finger der anderen Hand außen an deinen Daumen. Drück den Daumen nach außen gegen die Finger - dabei bewegt sich nichts. Halte die Spannung ruhig und atme weiter.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Handgelenk knickt zur Kleinfingerseite ab (Ulnarabweichung)","bilder":[],"video":""},{"id":"HAG-UAB-KOO-BAN-01","name":"TFCC-Stabilität: propriozeptives Training bei axialer Belastung","instruktion":"Verlager dein Gewicht langsam von einer Hand zur anderen und achte darauf, dass dein Handgelenk dabei stabil und ruhig bleibt.","dosis":"3S x 10 Wiederholungen, alternativ 3S x 20-30 s Halten mit Störreiz · kontrolliert · 2-3 x / Woche","kurz":"3S x 10 Wiederholungen, alternativ 3S x 20-30 s Halten mit Störreiz","hinweis":"endgradige Ulnarabduktion unter Last (komprimiert das TFCC zusätzlich), zu schnelle Gewichtsverlagerung","bilder":[],"video":""},{"id":"HAG-UAB-KRA-MUS-01","name":"Handgelenk Ulnarabduktion Kräftigung","instruktion":"Beweg dein Handgelenk gegen den Widerstand zur kleinen Fingerseite hin und dann wieder zurück zur Daumenseite.","dosis":"3S x 12-15W · 2 s hin, 2 s zurück · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"Mitbewegung des Unterarms, zu große Last","bilder":[],"video":""},{"id":"HAG-ZIR-KOO-BAN-01","name":"Kontrolliertes Handgelenkstraining, Dart-Thrower's-Motion","instruktion":"Beweg dein Handgelenk in einer diagonalen Linie, wie beim Wurf eines Dartpfeils - von schräg oben außen nach schräg unten innen und wieder zurück, langsam und kontrolliert.","dosis":"3S x 10-12 Wiederholungen · kontrolliert, ca. 2-3 s pro Richtung · 2-3 x / Woche","kurz":"3S x 10-12 Wiederholungen","hinweis":"Bewegung driftet in reine Flexion/Extension statt der diagonalen Linie, zu schnelles Tempo, Mitbewegung des Unterarms","bilder":[],"video":""},{"id":"HAG-ZIR-MOB-KRP-01","name":"Sanfte zyklische Handgelenksmobilisation","instruktion":"Kreis mit deiner Hand langsam und locker, in beide Richtungen, ohne Kraft aufzuwenden.","dosis":"3S x 10 Kreise je Richtung · langsam, ca. 3-4 s pro Kreis · täglich, bei Reizzustand mehrmals täglich kurz","kurz":"3S x 10 Kreise je Richtung","hinweis":"zu schnelles Tempo, endgradiges Einrasten","bilder":[],"video":""},{"id":"HUE-ABD-DEH-MUS-01","name":"Hüftabduktoren-Dehnung im Stand, überkreuzter Ausfallschritt (TFL/Glutaeus medius)","instruktion":"Kreuz dein Bein hinter das andere und schieb dein Becken zur Seite, bis du ein Ziehen an der Hüftaußenseite spürst.","dosis":"3 x 20-30 s je Seite · statisch · 2-3 x / Woche","kurz":"3 x 20-30 s je Seite","hinweis":"zu starke Intensität, zu lange Haltezeit, Anwendung trotz bestehender Glutealtendinopathie","bilder":[],"video":""},{"id":"HUE-ABD-KOO-BAN-01","name":"Seitlicher Ausfallschritt mit Beckenkontrolle (propriozeptiv)","instruktion":"Mach einen großen Schritt zur Seite und beug das Knie, ohne dass es nach innen fällt. Dein Becken bleibt dabei gerade nach vorne ausgerichtet.","dosis":"3S x 10-12W je Seite · kontrolliert, 2-3 s pro Richtung · 2-3 x / Woche","kurz":"3S x 10-12W je Seite","hinweis":"Knie fällt nach innen (Valgus), Becken kippt zur Seite, Oberkörper knickt nach vorne","bilder":[],"video":""},{"id":"HUE-ABD-KRA-MUS-01","name":"Hüftabduktion seitlich liegend / im Stand am Band (Glutaeus medius)","instruktion":"Heb dein oberes Bein gerade nach oben, ohne dass sich dein Becken nach hinten dreht. Der Fuß bleibt dabei nach vorne ausgerichtet.","dosis":"3S x 12-15W je Seite · 2 s hoch, 2 s runter · 2-3 x / Woche","kurz":"3S x 12-15W je Seite","hinweis":"Beckenrotation nach hinten (Ausweichen über Hüftbeuger/TFL statt Glutaeus medius), Bein wird nach vorne statt seitlich geführt, zu große Hüftflexion","bilder":[],"video":""},{"id":"HUE-ABD-KRA-SEH-01","name":"Isometrische Hüftabduktion in Neutralstellung (Stufe 1 Glutealsehne)","instruktion":"Drück dein Bein gegen den Widerstand nach außen und halte die Spannung ruhig. Leg dich dabei nicht mit beiden Beinen übereinander in eine zusammengepresste Position.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, konstante Spannung · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Ausgangsstellung mit übereinandergelegten Beinen in Adduktion (komprimiert die Sehne gegen den Trochanter), zu hohe Intensität am Anfang","bilder":[],"video":""},{"id":"HUE-ABD-KRA-SEH-02","name":"Heavy Slow Resistance Hüftabduktion seitlich liegend (Stufe 2 Glutealsehne)","instruktion":"Heb dein Bein langsam zur Seite an und senk es genauso langsam wieder ab, aber immer nur bis in die Mittelstellung - nicht darüber hinaus nach unten sinken lassen.","dosis":"3-4S x 6-15W, Last nach Wochenplan steigern: Woche 1 = 15RM, Woche 2-3 = 12RM, Woche 4-5 = 10RM, Woche 6-8 = 8RM, Woche 9-12 = 6RM · 3 s konzentrisch - 1 s halten - 3 s exzentrisch · 3 x / Woche, mindestens 48 h Abstand","kurz":"3-4S x 6-15W, Last nach Wochenplan steigern: Woche 1 = 15RM, Woche 2-3 = 12RM, Woche 4-5 = 10RM, Woche 6-8 = 8RM, Woche 9-12 = 6RM","hinweis":"Absenken unter die Nullstellung (Kompression der Sehne am Trochanter), Beckenrotation nach hinten, zu schnelles Tempo","bilder":[],"video":""},{"id":"HUE-ABD-KRA-SEH-03","name":"Step-down und Einbeinstand mit Beckenkontrolle (Stufe 3 Glutealsehne)","instruktion":"Steig langsam von der Stufe herunter, ohne dass deine Hüfte zur Seite wegkippt. Ein Spiegel oder Video hilft, das zu kontrollieren.","dosis":"3S x 10-12W je Seite · 3 s exzentrisch beim Absteigen · 2-3 x / Woche","kurz":"3S x 10-12W je Seite","hinweis":"Beckenabkippung zur Spielbeinseite (Trendelenburg), Ausweichen in Hüftadduktion, zu große Stufenhöhe von Beginn an","bilder":[],"video":""},{"id":"HUE-ABD-KRA-SEH-04","name":"Sportartspezifische Belastungsrückführung (Stufe 4 Glutealsehne)","instruktion":"Wir bauen die Belastung in kleinen Schritten auf. Jede Steigerung wird am nächsten Morgen überprüft.","dosis":"individuell nach Sportart und Trainingsplan · sportartspezifisch · 2-3 x / Woche intensiv","kurz":"individuell nach Sportart und Trainingsplan","hinweis":"zu schneller Umfangsaufbau, Rückkehr ohne bestandene Testbatterie, Vernachlässigung der Erhaltungsdosis aus Stufe 2","bilder":[],"video":""},{"id":"HUE-ADD-DEH-MUS-01","name":"Adduktorendehnung, Schmetterlingsposition","instruktion":"Setz die Fußsohlen aneinander und lass die Knie sanft zur Seite sinken oder beug dich mit geradem Rücken leicht nach vorne, bis es in der Leiste zieht.","dosis":"3 x 30-45 s · statisch · täglich","kurz":"3 x 30-45 s","hinweis":"Federnde, ruckartige Bewegung statt Halten, Rundrücken statt Beckenkippung","bilder":[],"video":""},{"id":"HUE-ADD-KRA-MUS-01","name":"Hüftadduktion im Stand am Band","instruktion":"Zieh dein Bein gegen das Band zur Körpermitte, als würdest du über eine Linie treten.","dosis":"3S x 12-15W je Seite · 2 s hin, 2 s zurück · 2-3 x / Woche","kurz":"3S x 12-15W je Seite","hinweis":"Ausweichen über Rumpfrotation, zu kleine Bewegungsamplitude, Standbeinknie fällt nach innen","bilder":[],"video":""},{"id":"HUE-ADD-KRA-SEH-01","name":"Copenhagen Adduction im Seitstütz (Adduktorensehne, Stufe 2)","instruktion":"Leg dich seitlich auf den Unterarm, dein oberes Bein liegt auf der Bank. Drück das obere Bein fest in die Bank und heb dein Becken an, bis dein Körper eine gerade Linie bildet. Dann langsam wieder absenken. Dein Oberkörper dreht dabei nicht mit.","dosis":"3-4S x 6-15W je Seite, Schwierigkeit über den Hebel steigern (erst Knie-, dann Fußauflage), später mit Zusatzlast · 3 s konzentrisch / 3 s exzentrisch · 3 x / Woche mit mindestens 48 h Abstand","kurz":"3-4S x 6-15W je Seite, Schwierigkeit über den Hebel steigern (erst Knie-, dann Fußauflage), später mit Zusatzlast","hinweis":"Ausweichen über Rumpfrotation","bilder":[],"video":""},{"id":"HUE-ADD-KRA-SEH-02","name":"Isometrisches Ball-Zusammendrücken zwischen den Knien (Adduktorensehne, Stufe 1)","instruktion":"Leg dich auf den Rücken, stell die Beine an und leg einen Ball zwischen deine Knie. Drück den Ball mit beiden Knien fest zusammen und halte die Spannung ruhig. Atme dabei weiter, dein Becken bleibt liegen.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Hohlkreuz oder Becken hebt ab","bilder":[],"video":""},{"id":"HUE-ARO-DEH-MUS-01","name":"Piriformis-Dehnung, Figur-4-Position in Rückenlage","instruktion":"Leg deinen Knöchel auf das andere Knie und zieh das Bein sanft Richtung Brust, bis es im Gesäß zieht.","dosis":"3 x 30-45 s je Seite · statisch · täglich","kurz":"3 x 30-45 s je Seite","hinweis":"zu ruckartiges Heranziehen, Ausweichen über Rumpfrotation statt reiner Hüftbewegung","bilder":[],"video":""},{"id":"HUE-ARO-KRA-MUS-01","name":"Außenrotation der Hüfte gegen Widerstand, Muschel-Übung (Clamshell)","instruktion":"Öffne dein oberes Knie wie eine Muschel, ohne dass sich dein Becken mitdreht. Die Füße bleiben zusammen.","dosis":"3S x 12-15W je Seite · 2 s hin, 2 s zurück · 2-3 x / Woche","kurz":"3S x 12-15W je Seite","hinweis":"Beckenrotation nach hinten statt reiner Hüftbewegung, zu große Kniebewegung ohne Kraftkomponente","bilder":[],"video":""},{"id":"HUE-EXT-DEH-MUS-01","name":"Gesäßdehnung, beide Knie zur Brust (Glutaeus maximus)","instruktion":"Zieh beide Knie sanft zur Brust, bis du ein Ziehen im Gesäß spürst. Der untere Rücken darf sich dabei rund anfühlen, das ist gewollt.","dosis":"3 x 30-45 s · statisch · täglich","kurz":"3 x 30-45 s","hinweis":"Ruckartiges Heranziehen, Anspannung im Nacken statt Loslassen","bilder":[],"video":""},{"id":"HUE-EXT-KOO-BAN-01","name":"Propriozeptiver Einbeinstand mit Hüftextension und Störreiz","instruktion":"Steh auf einem Bein und schwing das andere Bein langsam nach hinten und wieder zurück, ohne dass dein Becken zur Seite kippt.","dosis":"3S x 10 Wiederholungen je Seite, alternativ 3S x 30-45 s Halten mit Störreiz · kontrolliert, mit Störreiz auch reaktiv · 2-3 x / Woche","kurz":"3S x 10 Wiederholungen je Seite, alternativ 3S x 30-45 s Halten mit Störreiz","hinweis":"Ausweichen ins Hohlkreuz, Beckenabkippung zur Standbeinseite (Trendelenburg), Blick nach unten statt geradeaus","bilder":[],"video":""},{"id":"HUE-EXT-KRA-MUS-01","name":"Hüftextension in Rückenlage / Brücke (Glutaeus maximus)","instruktion":"Drück deine Fersen in den Boden und heb dein Becken an, bis dein Körper eine gerade Linie von den Knien bis zu den Schultern bildet. Oben den Po fest anspannen, dann langsam wieder ablegen.","dosis":"3S x 12-15W · 2 s hoch, 1 s halten, 2 s runter · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"Überstreckung der Lendenwirbelsäule statt Hüftextension, Ausweichen über die Ischiokruralen, ungleichmäßige Belastung beider Seiten","bilder":[],"video":""},{"id":"HUE-EXT-KRA-MUS-02","name":"Kreuzheben mit der Langhantel (Deadlift)","instruktion":"Stell dich so hin, dass die Stange über der Mitte deiner Füße liegt. Greif die Stange, spann den Bauch an und halt den Rücken gerade. Drück die Füße in den Boden und steh mit der Stange nah am Körper auf. Geh oben nicht ins Hohlkreuz. Leg die Stange genauso kontrolliert wieder ab.","dosis":"3-4S x 5-8W · kontrolliert zügig heben, 2-3 s ablegen · 1-2 x / Woche","kurz":"3-4S x 5-8W","hinweis":"Rundrücken beim Abheben","bilder":[],"video":""},{"id":"HUE-EXT-KRA-MUS-03","name":"Rumänisches Kreuzheben beidbeinig (Romanian Deadlift)","instruktion":"Halt die Stange vor den Oberschenkeln, die Knie sind leicht gebeugt. Schieb den Po nach hinten und neig den Oberkörper mit geradem Rücken nach vorn, bis du hinten an den Oberschenkeln eine deutliche Spannung spürst. Die Stange bleibt nah an den Beinen. Komm dann über die Hüfte wieder hoch.","dosis":"3S x 8-10W · 3 s absenken, 2 s aufrichten · 2 x / Woche","kurz":"3S x 8-10W","hinweis":"Rundrücken beim Absenken","bilder":[],"video":""},{"id":"HUE-EXT-KRA-MUS-04","name":"Hip Thrust mit der Langhantel","instruktion":"Leg den oberen Rücken an die Bank und die gepolsterte Stange auf deine Hüfte. Drück die Fersen in den Boden und heb das Becken an, bis dein Körper von den Knien bis zu den Schultern eine gerade Linie bildet. Spann oben den Po fest an und geh nicht ins Hohlkreuz. Senk das Becken dann langsam ab.","dosis":"3-4S x 8-12W · 2 s hoch, 1 s halten, 2 s runter · 2-3 x / Woche","kurz":"3-4S x 8-12W","hinweis":"Hohlkreuz statt Hüftstreckung oben","bilder":[],"video":""},{"id":"HUE-EXT-KRA-MUS-05","name":"Kettlebell Swing beidhändig","instruktion":"Stell die Kettlebell vor dich, beug dich mit geradem Rücken aus der Hüfte und greif sie mit beiden Händen. Schwing sie zwischen den Beinen nach hinten und streck dann kräftig die Hüfte, sodass die Kugel nach vorn bis etwa Brusthöhe schwingt. Die Kraft kommt aus dem Po, nicht aus den Armen. Lass sie zurückschwingen und beug dich erst dann wieder aus der Hüfte.","dosis":"5-8S x 10-15W · explosiv aus der Hüfte, Rückschwung locker · 2 x / Woche","kurz":"5-8S x 10-15W","hinweis":"Kettlebell mit den Armen hochheben statt aus der Hüfte schwingen","bilder":[],"video":""},{"id":"HUE-EXT-KRA-MUS-06","name":"Sprung-Shrug aus dem Hang (Jump Shrug) – Dreifachstreckung lernen","instruktion":"Halt die Stange mit gestreckten Armen vor den Oberschenkeln. Schieb den Po nach hinten, bis die Stange knapp über den Knien ist; der Rücken bleibt gerade. Spring dann explosiv nach oben: Hüfte, Knie und Füße gleichzeitig strecken und die Schultern zu den Ohren ziehen. Die Arme bleiben lang, die Stange bleibt nah am Körper. Lande weich und geh zurück in die Ausgangsstellung.","dosis":"3-5S x 3-5W · explosiv nach oben, weich landen · 2 x / Woche","kurz":"3-5S x 3-5W","hinweis":"Arme ziehen zu früh mit (die Ellbogen beugen sich)","bilder":[],"video":""},{"id":"HUE-EXT-KRA-MUS-07","name":"Umsetzen-Zug aus dem Hang (Hang Clean Pull) – ohne Fangen","instruktion":"Starte mit der Stange knapp über den Knien oder in der Mitte der Oberschenkel, der Rücken ist gerade. Streck dich dann explosiv in Hüfte, Knien und Füßen, bis du auf den Zehenspitzen stehst, und zieh die Schultern hoch. Die Arme bleiben lang, die Stange bleibt am Körper. Senk sie danach kontrolliert wieder ab.","dosis":"3-5S x 3-5W · explosive Streckung, kontrolliert absenken · 2 x / Woche","kurz":"3-5S x 3-5W","hinweis":"Ziehen mit den Armen statt Strecken mit den Beinen","bilder":[],"video":""},{"id":"HUE-EXT-KRA-MUS-08","name":"Umsetzen aus dem Hang (Hang Power Clean)","instruktion":"Beginn wie beim Zug: Stange knapp über den Knien, Rücken gerade. Streck dich explosiv in Hüfte, Knien und Füßen und zieh die Schultern hoch. Zieh dich dann schnell unter die Stange: Ellbogen schnell nach vorn drehen und die Stange vorn auf den Schultern fangen, dabei leicht in die Knie gehen. Steh danach aufrecht auf. Üb nur mit Gummischeiben und genug Platz.","dosis":"3-5S x 2-4W · explosiv strecken, schnell unter die Stange · 2 x / Woche","kurz":"3-5S x 2-4W","hinweis":"Stange wird mit den Armen hochgezogen (Reverse Curl) statt mit den Beinen beschleunigt","bilder":[],"video":""},{"id":"HUE-EXT-KRA-MUS-09","name":"Umsetzen vom Boden (Power Clean)","instruktion":"Stell dich wie beim Kreuzheben auf: Stange über der Fußmitte, Rücken gerade, Arme lang. Heb die Stange zuerst ruhig bis über die Knie. Streck dich dann explosiv in Hüfte, Knien und Füßen und zieh dich unter die Stange. Fang sie vorn auf den Schultern mit leicht gebeugten Knien und steh dann auf. Leg die Stange kontrolliert ab.","dosis":"3-5S x 1-3W · ruhig vom Boden bis über die Knie, dann explosiv · 2 x / Woche","kurz":"3-5S x 1-3W","hinweis":"Stange wird ruckartig vom Boden gerissen","bilder":[],"video":""},{"id":"HUE-EXT-KRA-SEH-01","name":"Isometrische Hüftextension, langer Hebel (proximale Hamstringsehne)","instruktion":"Drück dein gestrecktes Bein gegen den Widerstand nach hinten und halte die Spannung ruhig, ohne dass sich das Bein bewegt.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, konstante Spannung · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Hüfte wird dabei in tiefe Flexion oder Sitzposition gebracht (Kompression am Tuber ischiadicum), Luft anhalten, zu hohe Intensität von Beginn an","bilder":[],"video":""},{"id":"HUE-EXT-KRA-SEH-02","name":"Heavy Slow Resistance Rumänisches Kreuzheben einbeinig (proximale Hamstringsehne)","instruktion":"Kipp deinen Oberkörper langsam nach vorne, das andere Bein hebt sich nach hinten wie eine Waage. Dein Rücken bleibt dabei gerade, die Bewegung kommt aus der Hüfte.","dosis":"3-4S x 6-15W, Last nach Wochenplan steigern: Woche 1 = 15RM, Woche 2-3 = 12RM, Woche 4-5 = 10RM, Woche 6-8 = 8RM, Woche 9-12 = 6RM · 3 s exzentrisch (Vorneigen) - 3 s konzentrisch (Aufrichten) · 3 x / Woche, mindestens 48 h Abstand","kurz":"3-4S x 6-15W, Last nach Wochenplan steigern: Woche 1 = 15RM, Woche 2-3 = 12RM, Woche 4-5 = 10RM, Woche 6-8 = 8RM, Woche 9-12 = 6RM","hinweis":"Rundrücken, zu tiefe Hüftflexion (Kompression am Tuber ischiadicum), zu schnelles Tempo, zu leichte Last","bilder":[],"video":""},{"id":"HUE-FLS-DEH-MUS-01","name":"Ischiokrurale Dehnung im Langsitz (SLR-Vorbeuge)","instruktion":"Beug dich mit geradem Rücken aus der Hüfte nach vorne, bis es hinten am Oberschenkel zieht. Nicht den Rücken runden, um weiter zu kommen.","dosis":"3 x 30-45 s je Seite · statisch · täglich","kurz":"3 x 30-45 s je Seite","hinweis":"Rundrücken statt Beckenkippung, Ausweichen über Knieflexion, Luft anhalten","bilder":[],"video":""},{"id":"HUE-FLS-KOO-SON-01","name":"Neurodynamik N. ischiadicus – Slider in Rückenlage","instruktion":"Streck das Knie und senk gleichzeitig das Kinn Richtung Brust, dann beug das Knie wieder und heb den Kopf. Die Bewegung soll fließen, nicht ziehen.","dosis":"3S x 10 Wiederholungen · fließend, ca. 2-3 s pro Richtung · mehrmals täglich, kurze Serien","kurz":"3S x 10 Wiederholungen","hinweis":"Zu forciertes Endgradig-Dehnen (Tensioner statt Slider), Symptome werden bewusst provoziert und lange gehalten, zu hohe Wiederholungszahl in der Reizphase","bilder":[],"video":""},{"id":"HUE-FLX-DEH-MUS-01","name":"Hüftbeugerdehnung im Ausfallschritt (Thomas-Test-Position)","instruktion":"Schieb dein Becken nach vorne, als würdest du eine Wand wegschieben wollen. Der Po bleibt dabei angespannt, damit sich der Rücken nicht durchbiegt.","dosis":"3 Wiederholungen x 30-45 s je Seite · statisch haltend · täglich","kurz":"3 Wiederholungen x 30-45 s je Seite","hinweis":"Hohlkreuz statt Beckenkippung, hinteres Knie zu weit vorne, Ausweichen in Rumpfrotation","bilder":[],"video":""},{"id":"HUE-FLX-KRA-MUS-01","name":"Hüftflexion im Sitz gegen Widerstand (Iliopsoas/Rectus femoris)","instruktion":"Zieh dein Knie gegen das Band nach oben, als würdest du einen Treppenschritt anheben. Der Oberkörper bleibt ruhig, nicht mitschwingen.","dosis":"3S x 10-15W je Seite · 2 s konzentrisch, 2 s exzentrisch · 2-3 x / Woche","kurz":"3S x 10-15W je Seite","hinweis":"Ausweichen ins Hohlkreuz, Mitschwingen des Oberkörpers, Bewegung nur aus dem Unterschenkel statt aus der Hüfte","bilder":[],"video":""},{"id":"HUE-FLX-MOB-KRP-01","name":"Zyklisches Hüftpendeln in Rückenlage","instruktion":"Lass die Ferse langsam zum Po gleiten und wieder zurück, wie ein Scheibenwischer. Immer bis dorthin, wo es angenehm ist, nicht bis zum Anschlag.","dosis":"3S x 15-20 Wiederholungen · langsam, gleichmäßig, ca. 3 s pro Richtung · täglich, bei Reizzustand mehrmals täglich kurz","kurz":"3S x 15-20 Wiederholungen","hinweis":"Zu schnelles Tempo, endgradiges Einrasten, Ausweichen über das Becken statt reiner Hüftbewegung","bilder":[],"video":""},{"id":"HUE-IRO-DEH-MUS-01","name":"Dehnung der Innenrotatoren / TFL im Stand","instruktion":"Kreuz dein Bein hinter das Standbein und schieb dein Becken zur Seite, bis es an der Hüftaußenseite zieht.","dosis":"3 x 20-30 s je Seite · statisch · 2-3 x / Woche","kurz":"3 x 20-30 s je Seite","hinweis":"zu hohe Intensität, Anwendung trotz bestehender Glutealtendinopathie","bilder":[],"video":""},{"id":"HUE-IRO-KRA-MUS-01","name":"Innenrotation der Hüfte gegen Widerstand im Sitz","instruktion":"Dreh deinen Unterschenkel gegen das Band nach innen, der Oberschenkel bleibt dabei ruhig auf dem Stuhl liegen.","dosis":"3S x 12-15W je Seite · 2 s hin, 2 s zurück · 2-3 x / Woche","kurz":"3S x 12-15W je Seite","hinweis":"Mitbewegung des Oberschenkels statt isolierter Rotation, Ausweichen über das Becken","bilder":[],"video":""},{"id":"HUE-ZIR-KOO-BAN-01","name":"Kontrolliertes Hüftkreisen in alle Richtungen (Hip CARs)","instruktion":"Zieh mit deinem Bein einen möglichst großen, langsamen Kreis in der Luft, so kontrolliert wie möglich, ohne dass dein Becken mitschwingt.","dosis":"2S x 5 Kreise je Richtung und Seite · sehr langsam, ca. 8-10 s pro vollem Kreis · 2-4 x / Woche","kurz":"2S x 5 Kreise je Richtung und Seite","hinweis":"zu schnelles Tempo, Mitschwingen des Beckens, unvollständige Amplitude aus Bequemlichkeit","bilder":[],"video":""},{"id":"HWS-EXT-DEH-MUS-01","name":"Kinn-zur-Brust-Dehnung der Nackenextensoren","instruktion":"Senk dein Kinn Richtung Brust und leg deine Hände sanft auf den Hinterkopf, um ein kleines bisschen nachzuhelfen, bis es im Nacken zieht.","dosis":"3 x 20-30 s · statisch · täglich","kurz":"3 x 20-30 s","hinweis":"zu starker Druck mit den Händen, ruckartige Bewegung","bilder":[],"video":""},{"id":"HWS-EXT-KRA-MUS-01","name":"Nackenextension Kräftigung gegen Eigenwiderstand","instruktion":"Drück deinen Hinterkopf gegen deine Hände, als würdest du den Kopf in den Nacken legen wollen, aber die Hände halten dagegen. Gleichmäßiger Druck, kein Ruckeln.","dosis":"3S x 10W, Halten je 5 s, alternativ 5S x 20-30 s isometrisch · isometrisch bzw. 2 s aufbauend · 3-4 x / Woche","kurz":"3S x 10W, Halten je 5 s, alternativ 5S x 20-30 s isometrisch","hinweis":"zu hoher Krafteinsatz, Ausweichen ins Hohlkreuz der HWS (Überstreckung), Luft anhalten","bilder":[],"video":""},{"id":"HWS-FLX-DEH-MUS-01","name":"SCM- und Scalenus-Dehnung","instruktion":"Halt dein Schlüsselbein sanft fest und neig deinen Kopf zur anderen Seite, leicht nach hinten oben gedreht, bis es vorne am Hals zieht. Die Schulter bleibt dabei unten.","dosis":"3 x 20-30 s je Seite · statisch · täglich","kurz":"3 x 20-30 s je Seite","hinweis":"zu starker Zug, zu forcierte Rotation, Fixierung der Schulter mit zu viel Druck","bilder":[],"video":""},{"id":"HWS-FLX-KRA-MUS-01","name":"Nackenflexion Kräftigung gegen Eigenwiderstand","instruktion":"Drück deine Stirn gegen deine Hand, als würdest du nicken wollen, aber die Hand hält dagegen. Kein Ruckeln, gleichmäßiger Druck.","dosis":"3S x 10W, Halten je 5 s, alternativ 5S x 20-30 s isometrisch · isometrisch bzw. 2 s aufbauend · 3-4 x / Woche","kurz":"3S x 10W, Halten je 5 s, alternativ 5S x 20-30 s isometrisch","hinweis":"zu hoher Krafteinsatz, Ausweichen über die Schultern, Luft anhalten","bilder":[],"video":""},{"id":"HWS-FLX-MOB-KRP-01","name":"Sanfte zyklische Flexionsmobilisation im Sitz","instruktion":"Senk dein Kinn langsam Richtung Brust und richte dich dann wieder auf - wie ein sanftes Nicken. Nur so weit, wie es angenehm bleibt.","dosis":"3S x 10-12 Wiederholungen · langsam, ca. 3 s pro Richtung · täglich, bei Reizzustand mehrmals täglich kurz","kurz":"3S x 10-12 Wiederholungen","hinweis":"zu große Amplitude, zu schnelles Tempo, Ausweichen über den oberen Rücken statt reiner Nackenbewegung","bilder":[],"video":""},{"id":"HWS-INK-KOO-BAN-01","name":"Sichere kraniozervikale Kontrollübung mit Aufklärung über Warnzeichen","instruktion":"Beweg deinen Kopf ganz langsam und nur ein kleines Stück in ein sanftes Nicken und Kopfschütteln, immer deutlich innerhalb dessen, was sich völlig sicher anfühlt.","dosis":"2S x 8-10 Wiederholungen · sehr langsam, kontrolliert · täglich, sofern beschwerdefrei","kurz":"2S x 8-10 Wiederholungen","hinweis":"endgradige oder forcierte Bewegung, Kombination mehrerer Endstellungen gleichzeitig (z. B. maximale Rotation UND Extension kombiniert)","bilder":[],"video":""},{"id":"HWS-INK-KRA-MUS-01","name":"Kraniozervikale Flexion (CCFT-Training, isolierte tiefe Halsbeuger)","instruktion":"Mach ein ganz kleines, sanftes Nicken, so als würdest du leicht 'Ja' nicken - nur mit dem obersten Teil deines Kopfes, der restliche Nacken bleibt ruhig auf der Unterlage liegen.","dosis":"3S x 10 Wiederholungen, Halten je 10 s, Steigerung der Haltezeit über mehrere Wochen bis 30 s · langsam, 2 s aufbauend, dann halten · täglich","kurz":"3S x 10 Wiederholungen, Halten je 10 s, Steigerung der Haltezeit über mehrere Wochen bis 30 s","hinweis":"großräumige Kopfbeugung der ganzen HWS statt isolierter oberer Kopfgelenkbewegung, Mitanspannung des oberflächlichen SCM (sichtbar als hervortretende Sehne am Hals), Luft anhalten","bilder":[],"video":""},{"id":"HWS-LFX-DEH-MUS-01","name":"Seitliche Nackendehnung im Sitz","instruktion":"Neig deinen Kopf zur anderen Seite, während deine Schulter auf der zu dehnenden Seite unten bleibt, bis es seitlich am Hals zieht.","dosis":"3 x 20-30 s je Seite · statisch · täglich","kurz":"3 x 20-30 s je Seite","hinweis":"Schulter hebt mit an, zu starker Zug","bilder":[],"video":""},{"id":"HWS-LFX-KRA-MUS-01","name":"Lateralflexion Kräftigung gegen Eigenwiderstand","instruktion":"Drück deinen Kopf seitlich gegen deine Hand, die Hand hält dagegen. Gleichmäßiger Druck, kein Ruckeln.","dosis":"3S x 10W je Seite, Halten je 5 s · isometrisch · 3-4 x / Woche","kurz":"3S x 10W je Seite, Halten je 5 s","hinweis":"zu hoher Krafteinsatz, Ausweichen über die Schulter, Luft anhalten","bilder":[],"video":""},{"id":"HWS-PTR-KOO-MUS-01","name":"Wahrnehmungsübung gegen vorgeschobene Kopfhaltung (Forward Head Posture)","instruktion":"Schau in den Spiegel von der Seite und schieb deinen Kopf langsam so weit zurück, dass dein Ohr über deiner Schulter steht, ohne dabei nach unten zu schauen.","dosis":"3S x 8-10 Wiederholungen, Halten je 5-8 s · 2 s einstellen, 5-8 s halten, 2 s lösen · täglich, mehrmals","kurz":"3S x 8-10 Wiederholungen, Halten je 5-8 s","hinweis":"Blick senkt sich statt reiner Translationsbewegung, Kopf wird nach hinten geneigt statt nach hinten geschoben","bilder":[],"video":""},{"id":"HWS-ROT-KOO-SON-01","name":"Zervikale Propriozeption – Cervical Joint Position Sense Training","instruktion":"Dreh deinen Kopf mit geschlossenen Augen langsam zur Seite und dann wieder zurück zur Mitte, so genau du kannst. Öffne dann die Augen und schau, wie nah du an der Mitte warst.","dosis":"3S x 5-8 Wiederholungen je Seite · langsam, kontrolliert · täglich bis 3 x / Woche","kurz":"3S x 5-8 Wiederholungen je Seite","hinweis":"zu schnelle Bewegung, zu große Amplitude, Ausweichen über den Rumpf statt reiner Kopfbewegung","bilder":[],"video":""},{"id":"HWS-ROT-KRA-MUS-01","name":"Rotationskräftigung gegen Eigenwiderstand","instruktion":"Dreh deinen Kopf gegen deine Hand, die Hand hält dagegen. Gleichmäßiger Druck, kein Ruckeln.","dosis":"3S x 10W je Seite, Halten je 5 s · isometrisch · 3-4 x / Woche","kurz":"3S x 10W je Seite, Halten je 5 s","hinweis":"zu hoher Krafteinsatz, Ausweichen über den Rumpf","bilder":[],"video":""},{"id":"HWS-ROT-MOB-KRP-01","name":"Sanfte zyklische Rotationsmobilisation im Sitz","instruktion":"Dreh deinen Kopf langsam zu einer Seite, dann zurück zur Mitte und zur anderen Seite - wie ein sanftes Kopfschütteln in Zeitlupe.","dosis":"3S x 10-12 Wiederholungen je Seite · langsam, ca. 3 s pro Richtung · täglich","kurz":"3S x 10-12 Wiederholungen je Seite","hinweis":"zu große Amplitude, zu schnelles Tempo","bilder":[],"video":""},{"id":"HWS-RTR-KRA-MUS-01","name":"Chin Tuck – Retraktion gegen Widerstand","instruktion":"Schieb dein Kinn gerade nach hinten, als würdest du ein Doppelkinn machen wollen - der Kopf bleibt dabei auf derselben Höhe, er sinkt nicht nach unten.","dosis":"3S x 10W, Halten je 5 s · 2 s hin, 5 s halten, 2 s lösen · täglich","kurz":"3S x 10W, Halten je 5 s","hinweis":"Kinn senkt sich nach unten statt gerade nach hinten zu gleiten (das wird zur Flexion statt Retraktion), Anspannung im oberflächlichen SCM statt der tiefen Flexoren, Überstreckung im unteren Nacken als Ausweichbewegung","bilder":[],"video":""},{"id":"KNI-ARO-KOO-MUS-01","name":"Rotationskontrolle des Knies bei Richtungswechsel","instruktion":"Der Körper dreht sich über dem Bein, das Knie bleibt über dem Fuß. Die Drehung kommt aus der Hüfte, nicht aus dem Knie.","dosis":"3 bis 4 Sätze x 8 bis 10 Wiederholungen je Richtung · zunächst langsam und kontrolliert, später reaktiv · 2 x / Woche","kurz":"3 bis 4 Sätze x 8 bis 10 Wiederholungen je Richtung","hinweis":"Drehung findet im Knie statt in der Hüfte","bilder":[],"video":""},{"id":"KNI-EXT-DEH-MUS-01","name":"Quadrizepsdehnung in Bauch- oder Seitenlage","instruktion":"Ferse zum Po ziehen und dabei das Becken bewusst nicht ins Hohlkreuz kippen lassen. Das Ziehen gehört vorne in den Oberschenkel.","dosis":"3 Wiederholungen x 30 bis 45 s je Seite · statisch haltend · täglich","kurz":"3 Wiederholungen x 30 bis 45 s je Seite","hinweis":"Ausweichen ins Hohlkreuz","bilder":[],"video":""},{"id":"KNI-EXT-KOO-BAN-01","name":"Einbeinstand mit Störreizen und Landekontrolle","instruktion":"Ein Bein, Knie leicht gebeugt und über dem Fuß. Wenn du wackelst, fang dich über Fuß und Hüfte ab, nicht über die Arme.","dosis":"4 bis 6 Sätze x 30 s je Seite · statisch mit reaktiven Anteilen · mindestens 4 x / Woche über mindestens 6 Wochen","kurz":"4 bis 6 Sätze x 30 s je Seite","hinweis":"Knie fällt nach innen","bilder":[],"video":""},{"id":"KNI-EXT-KOO-BAN-02","name":"Landetechnik und Valguskontrolle (Drop Jump)","instruktion":"Weich landen, Knie zeigen über die Füße. Hüfte und Knie beugen sich mit, der Rumpf bleibt aufrecht.","dosis":"3 bis 5 Sätze x 5 bis 8 Sprünge · reaktiv, kurze Bodenkontaktzeit bei sauberer Achse · 2 x / Woche","kurz":"3 bis 5 Sätze x 5 bis 8 Sprünge","hinweis":"Knie fällt nach innen","bilder":[],"video":""},{"id":"KNI-EXT-KRA-KNO-01","name":"Impact-Serie zur Knochenstimulation","instruktion":"Zehn kraftvolle Sprünge, dann Pause. Lieber mehrmals am Tag kurz als einmal lange.","dosis":"4 bis 5 Sätze x 10 Sprünge, insgesamt etwa 40 bis 50 Zyklen · maximal reaktiv · täglich bis jeden zweiten Tag; die Mechanosensitivität des Knochens ist nach etwa 8 h wiederhergestellt","kurz":"4 bis 5 Sätze x 10 Sprünge, insgesamt etwa 40 bis 50 Zyklen","hinweis":"Zu viele Wiederholungen (der Reiz sättigt nach 40 bis 50 Zyklen)","bilder":[],"video":""},{"id":"KNI-EXT-KRA-MUS-01","name":"Quadrizepsspannung und Terminal Knee Extension","instruktion":"Drück die Kniekehle nach unten und zieh die Kniescheibe nach oben, bis die Ferse leicht abhebt. Fünf Sekunden halten.","dosis":"3 bis 5 Sätze x 10 Wiederholungen à 5 bis 10 s · isometrisch, 2 s aufbauen, halten, langsam lösen · mehrmals täglich, in P1 stündlich wenige Wiederholungen","kurz":"3 bis 5 Sätze x 10 Wiederholungen à 5 bis 10 s","hinweis":"Gesäß spannt mit","bilder":[],"video":""},{"id":"KNI-EXT-KRA-MUS-02","name":"Kniebeuge in der geschlossenen Kette","instruktion":"Setz dich nach hinten unten, als wolltest du dich auf einen Stuhl setzen. Die Knie zeigen über die Füße, nicht nach innen.","dosis":"3 bis 4 Sätze x 8 bis 12 Wiederholungen · 3 s abwärts, 1 s unten, 2 s aufwärts · 2 bis 3 x / Woche","kurz":"3 bis 4 Sätze x 8 bis 12 Wiederholungen","hinweis":"Knie fallen nach innen (dynamischer Valgus)","bilder":[],"video":""},{"id":"KNI-EXT-KRA-MUS-03","name":"Einbeinige Kniebeuge im Ausfallschritt (Split Squat)","instruktion":"Senk dich gerade nach unten ab, das Gewicht bleibt auf dem vorderen Bein. Das Knie darf nach vorne, aber nicht nach innen.","dosis":"3 bis 4 Sätze x 8 bis 10 Wiederholungen je Seite · 3 s abwärts, 2 s aufwärts · 2 x / Woche","kurz":"3 bis 4 Sätze x 8 bis 10 Wiederholungen je Seite","hinweis":"Valgus des vorderen Knies","bilder":[],"video":""},{"id":"KNI-EXT-KRA-MUS-04","name":"Kniebeuge mit der Langhantel im Rack (Back Squat)","instruktion":"Leg die Stange auf den oberen Rücken, nicht auf den Nacken. Atme ein, spann den Bauch fest an und setz dich nach hinten unten. Die Knie zeigen in Richtung der Fußspitzen, die Fersen bleiben am Boden. Drück dich dann aus dem ganzen Fuß wieder nach oben. Üb immer im Ständer mit eingestellten Sicherheitsablagen.","dosis":"3-4S x 6-10W · 2-3 s abwärts, kurz unten, kontrolliert zügig aufwärts · 2-3 x / Woche","kurz":"3-4S x 6-10W","hinweis":"Knie fallen nach innen","bilder":[],"video":""},{"id":"KNI-EXT-KRA-MUS-05","name":"Frontkniebeuge mit der Langhantel (Front Squat)","instruktion":"Leg die Stange vorn auf die Schultern und halt die Ellbogen hoch. Spann den Bauch an und geh mit aufrechtem Oberkörper gerade nach unten. Die Knie zeigen über die Fußspitzen. Drück dich dann wieder hoch, ohne dass die Ellbogen nach unten fallen.","dosis":"3-4S x 5-8W · 2-3 s abwärts, kontrolliert zügig aufwärts · 2 x / Woche","kurz":"3-4S x 5-8W","hinweis":"Ellbogen fallen nach unten, die Stange rollt nach vorn","bilder":[],"video":""},{"id":"KNI-EXT-KRA-MUS-06","name":"Beinpresse an der Maschine (Leg Press)","instruktion":"Setz dich mit dem ganzen Rücken an die Lehne und stell die Füße hüftbreit auf die Platte. Lass die Platte langsam zu dir kommen, bis die Knie etwa rechtwinklig gebeugt sind. Drück sie dann wieder weg, ohne die Knie ganz durchzustrecken. Dein Po bleibt die ganze Zeit an der Lehne.","dosis":"3-4S x 8-12W · 3 s ablassen, 2 s drücken · 2-3 x / Woche","kurz":"3-4S x 8-12W","hinweis":"Knie werden oben ruckartig durchgestreckt","bilder":[],"video":""},{"id":"KNI-EXT-KRA-MUS-07","name":"Beinstrecker an der Maschine (Leg Extension)","instruktion":"Setz dich so hin, dass dein Knie genau neben dem Drehpunkt der Maschine ist. Streck die Beine langsam, halte oben kurz und lass sie dann langsam wieder sinken. Arbeite ohne Schwung.","dosis":"3S x 10-15W · 2 s strecken, 1 s halten, 3 s ablassen · 2-3 x / Woche","kurz":"3S x 10-15W","hinweis":"Schwung holen und oben in die Streckung schlagen","bilder":[],"video":""},{"id":"KNI-EXT-KRA-MUS-08","name":"Ausfallschritt vorwärts, rückwärts und gehend (Lunge)","instruktion":"Mach einen großen Schritt nach hinten und senk dich ab, bis das hintere Knie knapp über dem Boden ist. Drück dich über das vordere Bein zurück in den Stand. Das vordere Knie zeigt dabei über den Fuß und knickt nicht nach innen. Wenn das sicher klappt, üb den Schritt nach vorn.","dosis":"3S x 8-12W je Bein · 2 s absenken, kontrolliert zurück · 2-3 x / Woche","kurz":"3S x 8-12W je Bein","hinweis":"Vorderes Knie knickt nach innen","bilder":[],"video":""},{"id":"KNI-EXT-KRA-MUS-09","name":"Step-up auf eine Bank oder Kiste mit Kurzhanteln","instruktion":"Stell einen Fuß ganz auf die Kiste. Verlager dein Gewicht nach vorn und steig nur mit diesem Bein hinauf, ohne dich unten abzustoßen. Stell dich oben gerade hin und steig dann langsam wieder hinunter. Das Knie bleibt über dem Fuß.","dosis":"3S x 8-10W je Bein · 2 s hinauf, 3 s hinunter · 2 x / Woche","kurz":"3S x 8-10W je Bein","hinweis":"Abstoßen mit dem unteren Bein","bilder":[],"video":""},{"id":"KNI-EXT-KRA-SEH-01","name":"Spanish Squat oder Wandsitz isometrisch (Stufe 1 Sehne)","instruktion":"Setz dich gegen das Band zurück und halte die Position ruhig. Der Oberkörper bleibt aufrecht.","dosis":"Start 3 Sätze x 30 s, schrittweise steigern bis 5 Sätze x 45 s · isometrisch · 2 x täglich, jeden Tag","kurz":"Start 3 Sätze x 30 s, schrittweise steigern bis 5 Sätze x 45 s","hinweis":"Zu geringe Beugung","bilder":[],"video":""},{"id":"KNI-EXT-KRA-SEH-02","name":"Heavy Slow Resistance Kniebeuge und Beinstrecker (Stufe 2 Sehne)","instruktion":"Drei Sekunden runter, drei Sekunden hoch. Die Last soll so schwer sein, dass die letzten zwei Wiederholungen wirklich fordern.","dosis":"3 bis 4 Sätze x 6 bis 15 Wiederholungen, Wochenprogression: Woche 1 = 15RM, Woche 2 bis 3 = 12RM, Woche 4 bis 5 = 10RM, Woche 6 bis 8 = 8RM, Woche 9 bis 12 = 6RM · 3 s konzentrisch, 3 s exzentrisch · 3 x / Woche mit mindestens 48 h Abstand","kurz":"3 bis 4 Sätze x 6 bis 15 Wiederholungen, Wochenprogression: Woche 1 = 15RM, Woche 2 bis 3 = 12RM, Woche 4 bis 5 = 10RM, Woche 6 bis 8 = 8RM, Woche 9 bis 12 = 6RM","hinweis":"Zu leichte Last","bilder":[],"video":""},{"id":"KNI-EXT-KRA-SEH-03","name":"Exzentrische Kniebeuge auf der schiefen Ebene (Decline Squat)","instruktion":"Nur das Absenken zählt und passiert einbei
