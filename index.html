nig. Zum Hochkommen nimmst du beide Beine.","dosis":"3 Sätze x 15 Wiederholungen, 2 x täglich · exzentrisch etwa 3 s · täglich über etwa 12 Wochen","kurz":"3 Sätze x 15 Wiederholungen, 2 x täglich","hinweis":"Ohne Neigung ausgeführt (deutlich geringerer Sehnenreiz)","bilder":[],"video":""},{"id":"KNI-EXT-KRA-SEH-04","name":"Sprung- und Landeserie mit Energiespeicherung (Stufe 3 Sehne)","instruktion":"Weich landen, Knie über den Füßen, kein Einknicken nach innen. Lieber niedriger springen und sauber landen.","dosis":"4 bis 6 Sätze x 8 bis 15 Sprünge · reaktiv, kurze Bodenkontaktzeit · 2 x / Woche mit mindestens 48 h Abstand","kurz":"4 bis 6 Sätze x 8 bis 15 Sprünge","hinweis":"Valgus bei der Landung","bilder":[],"video":""},{"id":"KNI-EXT-KRA-SEH-05","name":"Sportspezifische Belastungsrückführung (Stufe 4 Sehne)","instruktion":"Wir steigern in kleinen Schritten. Jede Steigerung überprüfen wir am nächsten Morgen.","dosis":"individuell nach Sportart und Trainingsplan · sportartspezifisch · 2 bis 3 x / Woche intensiv","kurz":"individuell nach Sportart und Trainingsplan","hinweis":"Zu schneller Umfangsaufbau, Rückkehr ohne bestandene Testbatterie","bilder":[],"video":""},{"id":"KNI-EXT-KRA-SEH-06","name":"Isometrische Kniestreckung im Sitz, Knie etwa 60 Grad gebeugt (Beinstrecker-Isometrie, Stufe 1 Sehne)","instruktion":"Setz dich auf einen Stuhl, dein Knie ist gebeugt. Leg die Ferse deines anderen Beins von vorne gegen dein Schienbein, knapp über dem Knöchel. Versuch, dein Bein zu strecken, und halte mit dem anderen Bein dagegen - dabei bewegt sich nichts. Halte die Spannung ruhig und atme weiter.","dosis":"Start 3 Sätze x 30 s, schrittweise steigern bis 5 Sätze x 45 s · isometrisch, Spannung 2 bis 3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3 Sätze x 30 s, schrittweise steigern bis 5 Sätze x 45 s","hinweis":"Oberschenkel hebt von der Sitzfläche ab","bilder":[],"video":""},{"id":"KNI-EXT-MOB-BAN-01","name":"Extensionsmobilisation in Bauchlage (Prone Hang)","instruktion":"Lass das Bein einfach hängen und entspann den Oberschenkel komplett. Es soll ziehen, aber nicht wehtun.","dosis":"3 bis 5 Durchgänge à 3 bis 5 Minuten · statisch, passiv · 2 bis 3 x täglich","kurz":"3 bis 5 Durchgänge à 3 bis 5 Minuten","hinweis":"Oberschenkel liegt zu weit auf der Bank","bilder":[],"video":""},{"id":"KNI-EXT-MOB-KRP-01","name":"Zyklische Entlastungsmobilisation auf dem Ergometer","instruktion":"Locker treten mit wenig Widerstand. Es soll nicht anstrengend sein, sondern gleichmäßig und lange.","dosis":"20 bis 40 Minuten · 80 bis 90 Umdrehungen pro Minute · täglich bis 5 x / Woche","kurz":"20 bis 40 Minuten","hinweis":"Zu hoher Widerstand (wird zur Kompressionsbelastung)","bilder":[],"video":""},{"id":"KNI-FLX-DEH-MUS-01","name":"Ischiokruraldehnung im Sitz oder Stand","instruktion":"Beweg dich aus der Hüfte nach vorne und lass den Rücken dabei lang. Das Ziehen gehört in die Oberschenkelrückseite.","dosis":"3 Wiederholungen x 30 bis 45 s je Seite · statisch haltend · täglich","kurz":"3 Wiederholungen x 30 bis 45 s je Seite","hinweis":"Rundrücken statt Beckenkippung","bilder":[],"video":""},{"id":"KNI-FLX-KRA-MUS-01","name":"Nordic Hamstring Curl (exzentrische Ischiokrurale)","instruktion":"Halte den Körper wie ein Brett und lass dich so langsam wie möglich nach vorne. Fang dich mit den Händen ab.","dosis":"Aufbau über Wochen: Woche 1 = 1 Satz x 5, Woche 2 = 2 x 6, Woche 3 = 3 x 6 bis 8, danach 3 x 8 bis 10 · exzentrisch so langsam wie möglich, mindestens 3 s · 1 bis 2 x / Woche, nicht mehr","kurz":"Aufbau über Wochen: Woche 1 = 1 Satz x 5, Woche 2 = 2 x 6, Woche 3 = 3 x 6 bis 8, danach 3 x 8 bis 10","hinweis":"Hüfte knickt ein","bilder":[],"video":""},{"id":"KNI-FLX-KRA-MUS-02","name":"Beinbeuger am Gerät oder mit Gleitunterlage","instruktion":"Fersen langsam heranziehen, oben kurz halten, dann noch langsamer wieder wegschieben.","dosis":"3 Sätze x 10 bis 12 Wiederholungen · 2 s konzentrisch, 1 s halten, 3 s exzentrisch · 2 bis 3 x / Woche","kurz":"3 Sätze x 10 bis 12 Wiederholungen","hinweis":"Becken sackt ab","bilder":[],"video":""},{"id":"KNI-FLX-KRA-MUS-03","name":"Isometrische Kniebeugung in mehreren Winkeln, Ferse in die Unterlage drücken (Ischiokrurale)","instruktion":"Leg dich auf den Rücken und stell das Bein an. Drück die Ferse fest in den Boden und zieh sie gleichzeitig Richtung Po - dabei bewegt sich nichts. Halte die Spannung ruhig und atme weiter. Es darf sich anstrengend anfühlen, aber nicht wehtun.","dosis":"Start 3 Sätze x 30 s im aktuellen Kniewinkel, schrittweise steigern bis 5 Sätze x 45 s, dann nächster Winkel · isometrisch, Spannung 2 bis 3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3 Sätze x 30 s im aktuellen Kniewinkel, schrittweise steigern bis 5 Sätze x 45 s, dann nächster Winkel","hinweis":"Becken hebt ab oder Hohlkreuz","bilder":[],"video":""},{"id":"KNI-FLX-MOB-BAN-01","name":"Fersengleiten und Wall Slides (Flexionsmobilisation)","instruktion":"Zieh die Ferse langsam zum Po, bis es deutlich spannt. Kurz halten, dann wieder lang machen.","dosis":"3 Sätze x 10 bis 15 Wiederholungen, endgradig 5 bis 10 s halten · langsam, 3 s hin, halten, 3 s zurück · 3 bis 5 x täglich in der Frühphase","kurz":"3 Sätze x 10 bis 15 Wiederholungen, endgradig 5 bis 10 s halten","hinweis":"Zu schnelles Ziehen","bilder":[],"video":""},{"id":"KNI-PAT-MOB-BAN-01","name":"Patellamobilisation in alle vier Richtungen","instruktion":"Oberschenkel ganz locker lassen, sonst lässt sich die Kniescheibe nicht bewegen. Dann sanft in alle vier Richtungen schieben.","dosis":"je Richtung 10 Wiederholungen mit 5 s Haltezeit · langsam, kein Ruckeln · 2 bis 3 x täglich","kurz":"je Richtung 10 Wiederholungen mit 5 s Haltezeit","hinweis":"Quadrizeps angespannt","bilder":[],"video":""},{"id":"LWS-ANT-DEH-MUS-01","name":"Hüftbeuger- und Rückenstreckerdehnung zur Reduktion der Beckenkippung","instruktion":"Spann zuerst deinen Bauch und Po an, als würdest du dein Becken nach hinten kippen wollen, und schieb dann erst dein Becken nach vorne, bis es vorne zieht. Die Anspannung bleibt dabei bestehen.","dosis":"3 x 30-45 s je Seite · statisch, mit aktiver Beckenkontrolle · täglich","kurz":"3 x 30-45 s je Seite","hinweis":"Becken vor der Dehnung nicht aktiv aufrichten, dadurch Ausweichen ins Hohlkreuz statt echter Hüftbeugerdehnung","bilder":[],"video":""},{"id":"LWS-ANT-KRA-MUS-01","name":"Aktive Beckenkippung im Vierfüßlerstand (Cat-Cow, Anteversionsanteil)","instruktion":"Kipp dein Becken nach vorne, dein Bauch sinkt Richtung Boden und dein Blick hebt sich leicht. Dann komm kontrolliert zurück in die Mitte.","dosis":"3S x 10-12 Wiederholungen · langsam, ca. 3 s pro Richtung · täglich","kurz":"3S x 10-12 Wiederholungen","hinweis":"passives Durchhängen ohne aktive Kontrolle, zu schnelles Tempo, endgradiges Durchdrücken ins Hohlkreuz","bilder":[],"video":""},{"id":"LWS-EXT-DEH-MUS-01","name":"Bauchmuskeldehnung in Bauchlage (Sphinx-Position)","instruktion":"Stütz dich auf die Unterarme und lass dein Becken auf dem Boden liegen, bis du vorne am Bauch ein Ziehen spürst.","dosis":"3 x 20-30 s · statisch · täglich, sofern gut vertragen","kurz":"3 x 20-30 s","hinweis":"zu schnelles Hochdrücken, Gesäßanspannung statt Loslassen, Fortführen trotz ausstrahlender Beschwerden","bilder":[],"video":""},{"id":"LWS-EXT-KOO-BAN-01","name":"Vierfüßlerstand Bird-Dog (Arm-Bein-Diagonale)","instruktion":"Streck einen Arm und das andere Bein gleichzeitig gerade aus, ohne dass sich dein Becken oder dein Rücken dabei bewegen oder verdrehen.","dosis":"3S x 8-10W je Seite · 2 s ausstrecken, 2 s halten, 2 s zurück · 3-4 x / Woche","kurz":"3S x 8-10W je Seite","hinweis":"Rotation oder Abkippen des Beckens, Hohlkreuz durch zu starkes Anheben des Beins, zu schnelles Tempo","bilder":[],"video":""},{"id":"LWS-EXT-KRA-MUS-01","name":"Rückenstreckerkräftigung, kontrollierte Rumpfextension in Bauchlage","instruktion":"Heb deinen Brustkorb nur wenige Zentimeter vom Boden ab, der Blick bleibt zum Boden gerichtet. Kein Durchdrücken ins Hohlkreuz, eine kleine, saubere Bewegung reicht.","dosis":"3S x 10-15W · 2 s hoch, 2 s runter · 2-3 x / Woche","kurz":"3S x 10-15W","hinweis":"zu große Bewegungsamplitude (endgradige Hyperextension), Ausweichen über die Halswirbelsäule, ruckartiges Hochschnellen","bilder":[],"video":""},{"id":"LWS-EXT-KRA-MUS-02","name":"Rückenstrecken am Hyperextensionsgerät (Back Extension)","instruktion":"Leg die Hüfte auf das Polster und hak die Fersen ein. Kreuz die Arme vor der Brust. Senk den Oberkörper mit geradem Rücken ab und heb ihn dann wieder an, bis dein Körper eine gerade Linie bildet. Überstreck dich nicht nach hinten.","dosis":"3S x 10-15W · 2 s hoch, 1 s halten, 2 s runter · 2-3 x / Woche","kurz":"3S x 10-15W","hinweis":"Überstrecken über die Körperlinie hinaus (Hohlkreuz)","bilder":[],"video":""},{"id":"LWS-FLX-KOO-SON-01","name":"Neurodynamik Slump-Slider im Sitz","instruktion":"Rund deinen Rücken und senk das Kinn, während du gleichzeitig ein Bein streckst. Dann richte dich auf, hebst den Kopf und beugst das Bein wieder gleichzeitig. Die Bewegung soll fließen.","dosis":"3S x 10 Wiederholungen je Seite · fließend, ca. 2-3 s pro Richtung · mehrmals täglich, kurze Serien","kurz":"3S x 10 Wiederholungen je Seite","hinweis":"alle Komponenten gleichzeitig endgradig kombinieren (wird zum Tensioner statt Slider), Symptome werden bewusst provoziert und lange gehalten","bilder":[],"video":""},{"id":"LWS-FLX-KRA-MUS-01","name":"Bauchmuskelkräftigung Curl-up mit Beckenkontrolle","instruktion":"Heb Kopf und Schultern leicht an, so dass dein unterer Rücken die ganze Zeit gleich stark auf deine Hände drückt. Der untere Rücken bewegt sich nicht mit.","dosis":"3S x 10-15W · 2 s hoch, 2 s runter · 3-4 x / Woche","kurz":"3S x 10-15W","hinweis":"Zug am Nacken mit den Händen, hohe Wiederholungszahl mit schlechter Qualität statt weniger sauberer Wiederholungen, Luft anhalten, Bewegung aus dem unteren Rücken statt aus dem oberen Rumpf","bilder":[],"video":""},{"id":"LWS-FLX-KRA-MUS-02","name":"Unterarmstütz (Plank)","instruktion":"Stütz dich auf die Unterarme, die Ellbogen sind unter den Schultern. Heb den Körper an, bis Kopf, Rücken und Beine eine gerade Linie bilden. Spann Bauch und Po an und atme ruhig weiter. Der Po hängt nicht durch und ragt nicht nach oben.","dosis":"3-5S x 20-40 s · statisch halten · 3 x / Woche","kurz":"3-5S x 20-40 s","hinweis":"Becken sinkt ab (Hohlkreuz)","bilder":[],"video":""},{"id":"LWS-FLX-MOB-KRP-01","name":"Lumbale Flexionsmobilisation, Knie-zur-Brust zyklisch","instruktion":"Zieh beide Knie langsam zur Brust und leg sie wieder ab, wie ein sanftes Schaukeln. Nicht bis zum Anschlag ziehen, nur so weit, wie es angenehm ist.","dosis":"3S x 10-15 Wiederholungen · langsam, ca. 3 s pro Richtung · täglich, bei akuter Reizung mehrmals täglich kurz","kurz":"3S x 10-15 Wiederholungen","hinweis":"ruckartiges Ziehen, zu starker Zug bis in den Schmerz, Luft anhalten","bilder":[],"video":""},{"id":"LWS-LFX-DEH-MUS-01","name":"Dehnung der lateralen Rumpfmuskulatur im Stand (M. quadratus lumborum)","instruktion":"Heb einen Arm über den Kopf und beug dich zur anderen Seite, bis es seitlich am Rumpf zieht. Dein Becken bleibt dabei gerade nach vorne ausgerichtet.","dosis":"3 x 20-30 s je Seite · statisch · täglich","kurz":"3 x 20-30 s je Seite","hinweis":"Ausweichen in Rumpfrotation oder -flexion statt reiner Seitneigung, Federn statt Halten","bilder":[],"video":""},{"id":"LWS-LFX-KRA-MUS-01","name":"Seitliche Rumpfkräftigung, Seitstütz (Side Plank)","instruktion":"Stütz dich auf den Unterarm und heb dein Becken an, bis dein Körper eine gerade Linie bildet. Halte die Position ruhig, ohne durchzuhängen.","dosis":"3S x 20-40 s je Seite · isometrisch haltend · 2-3 x / Woche","kurz":"3S x 20-40 s je Seite","hinweis":"Becken sackt nach unten durch, Schulter kollabiert Richtung Ohr, Rumpf dreht sich nach vorne oder hinten","bilder":[],"video":""},{"id":"LWS-LFX-KRA-MUS-02","name":"Einseitiges Tragen (Suitcase Carry) und Farmer's Walk","instruktion":"Nimm eine schwere Hantel in eine Hand und geh aufrecht los. Lass dich nicht zur Seite ziehen – deine Schultern bleiben auf gleicher Höhe. Atme ruhig weiter. Wechsle nach der Strecke die Hand.","dosis":"3-4 Strecken x 20-30 m je Seite · ruhiges, normales Gehtempo · 2-3 x / Woche","kurz":"3-4 Strecken x 20-30 m je Seite","hinweis":"Oberkörper neigt sich zur Last","bilder":[],"video":""},{"id":"LWS-RET-KOO-BAN-01","name":"Beckenkippung kontrolliert auf dem Sitzball (Pelvic Clock)","instruktion":"Stell dir vor, dein Becken ist eine Uhr, und bewege es langsam und kontrolliert in alle Richtungen - nach vorne, hinten und zur Seite.","dosis":"2S x 8-10 Wiederholungen je Richtung · langsam, ca. 2-3 s pro Bewegung · 2-4 x / Woche","kurz":"2S x 8-10 Wiederholungen je Richtung","hinweis":"Bewegung aus den Beinen statt aus dem Becken, zu schnelles Tempo, Ball nicht ausreichend aufgepumpt (instabil)","bilder":[],"video":""},{"id":"LWS-RET-KRA-MUS-01","name":"Beckenaufrichtung / Posterior Pelvic Tilt in Rückenlage","instruktion":"Spann Bauch und Po an und drück deinen unteren Rücken sanft in den Boden. Halte kurz, dann lass wieder locker.","dosis":"3S x 10-12 Wiederholungen, Halten je 5-8 s · 2 s anspannen, 5-8 s halten, 2 s lösen · täglich","kurz":"3S x 10-12 Wiederholungen, Halten je 5-8 s","hinweis":"Anspannung nur über die Atmung statt aktiver Muskelarbeit, Luft anhalten, zu starkes Pressen","bilder":[],"video":""},{"id":"LWS-ROT-KOO-BAN-01","name":"Kontrollierte Rumpfrotation im Sitz mit Beckenfixierung","instruktion":"Dreh deinen Oberkörper langsam zur einen Seite und dann zur anderen, dein Becken bleibt dabei ruhig auf dem Stuhl sitzen.","dosis":"3S x 10 Wiederholungen je Seite · langsam, ca. 2-3 s pro Richtung · 2-3 x / Woche","kurz":"3S x 10 Wiederholungen je Seite","hinweis":"endgradiges Forcieren der Rotation, Mitbewegung des Beckens, ruckartiges Tempo","bilder":[],"video":""},{"id":"LWS-ROT-KRA-SEH-01","name":"Anti-Rotations-Halten am Kabelzug (Pallof Press)","instruktion":"Drück deine Hände gerade nach vorne weg und halte deinen Rumpf dabei ganz ruhig, ohne dass dich das Band zur Seite dreht.","dosis":"3S x 20-30 s je Seite · isometrisch · 2-3 x / Woche","kurz":"3S x 20-30 s je Seite","hinweis":"Zulassen einer sichtbaren Rotation, Ausweichen über die Hüfte statt Rumpfkontrolle, Bandspannung zu gering für echten Trainingsreiz","bilder":[],"video":""},{"id":"LWS-ROT-MOB-KRP-01","name":"Sanfte Rotationsmobilisation in Rückenlage (Wirbelsäulen-Twist)","instruktion":"Lass deine Knie zusammen langsam zu einer Seite sinken, deine Schultern bleiben dabei am Boden. Dann wieder zur Mitte und zur anderen Seite.","dosis":"3S x 8-10 Wiederholungen je Seite · langsam, ca. 3-4 s pro Richtung · täglich","kurz":"3S x 8-10 Wiederholungen je Seite","hinweis":"Schultern heben vom Boden ab, zu schnelles Tempo, Absinken bis in den Schmerz","bilder":[],"video":""},{"id":"LWS-SIG-KOO-BAN-01","name":"Aktives Beinheben in Rückenlage mit ISG-Kontrolle (Active Straight Leg Raise Training)","instruktion":"Spann zuerst deinen Bauch und Beckenboden sanft an, dann heb das gestreckte Bein ein Stück vom Boden ab, ohne dass sich dein Becken dabei verdreht.","dosis":"3S x 8-10W je Seite · 2 s hoch, 2 s runter · 2-3 x / Woche","kurz":"3S x 8-10W je Seite","hinweis":"Anheben ohne vorherige Rumpfaktivierung, Beckenrotation, zu große Anhebehöhe","bilder":[],"video":""},{"id":"LWS-SIG-KRA-MUS-01","name":"Tiefe Bauchmuskel- und Beckenbodenaktivierung zur ISG-Stabilisierung","instruktion":"Spann deinen Beckenboden sanft an, als würdest du das Wasserlassen kurz zurückhalten, und zieh gleichzeitig deinen unteren Bauch ganz leicht ein. Atme dabei normal weiter.","dosis":"3S x 10 Wiederholungen, Halten je 5-10 s · 2 s anspannen, 5-10 s halten, 2 s lösen · täglich, mehrmals","kurz":"3S x 10 Wiederholungen, Halten je 5-10 s","hinweis":"zu starkes Pressen statt sanfter Anspannung, Luft anhalten, Mitanspannung der großen Bauchmuskeln oder des Gesäßes statt der tiefen Schicht","bilder":[],"video":""},{"id":"SCG-ABR-KRA-MUS-01","name":"Abwärtsrotation, exzentrische Kontrolle beim Armsenken","instruktion":"Senk deinen Arm aus der Überkopfposition ganz langsam und kontrolliert ab, als würdest du eine Bewegung bremsen wollen.","dosis":"3S x 10-12W · 4-5 s für die gesamte Abwärtsbewegung · 2-3 x / Woche","kurz":"3S x 10-12W","hinweis":"unkontrolliertes, schnelles Fallenlassen des Arms, Ausweichen über Rumpfrotation","bilder":[],"video":""},{"id":"SCG-ATI-KOO-MUS-01","name":"Wahrnehmungs- und Kontrollübung gegen anteriore Schulterblattkippung","instruktion":"Schau in den Spiegel und bring deine Schulterblätter bewusst in eine flach anliegende, aufrechte Position, ohne sie dabei nach hinten zu übertreiben oder ins Hohlkreuz zu fallen.","dosis":"3S x 8-10 Wiederholungen, Halten je 5-8 s · 2 s einstellen, 5-8 s halten, 2 s lösen · täglich, mehrmals","kurz":"3S x 8-10 Wiederholungen, Halten je 5-8 s","hinweis":"Übertreiben in die Gegenrichtung (starke Retraktion mit Hohlkreuz), Verwechslung mit reinem Schulter-nach-hinten-Ziehen ohne echte Kippungskorrektur","bilder":[],"video":""},{"id":"SCG-AWR-KOO-BAN-01","name":"Propriozeptives Training des skapulohumeralen Rhythmus beim Überkopfgreifen","instruktion":"Greif langsam und kontrolliert nach dem Gegenstand über deinem Kopf und leg ihn wieder ab, achte dabei auf eine gleichmäßige, flüssige Bewegung deiner Schulter.","dosis":"3S x 8-10 Wiederholungen · kontrolliert, später auch zügiger · 2-3 x / Woche","kurz":"3S x 8-10 Wiederholungen","hinweis":"Ausweichen über Rumpfüberstreckung statt echter Schulterbewegung, ruckartiges Greifen","bilder":[],"video":""},{"id":"SCG-AWR-KRA-MUS-01","name":"Aufwärtsrotation Kräftigung, Wandschieben diagonal (Y-Raise)","instruktion":"Bring deine Arme in die Y-Stellung schräg über den Kopf und schieb sie noch ein Stück weiter nach oben, dein Schulterblatt dreht sich dabei bewusst mit. Dann langsam wieder zurück.","dosis":"3S x 10-12W · 2 s hoch, 2 s runter · 2-3 x / Woche","kurz":"3S x 10-12W","hinweis":"Ausweichen über Hohlkreuz oder Schulterhochzug statt sauberer Schulterblattrotation, zu schweres Gewicht von Beginn an","bilder":[],"video":""},{"id":"SCG-DEP-KRA-MUS-01","name":"Schulterblatt-Depression Kräftigung im Stand","instruktion":"Drück dich auf deinen Händen ab und zieh dabei deine Schulterblätter aktiv nach unten, sodass sich dein Oberkörper ein kleines Stück anhebt. Die Arme bleiben gestreckt.","dosis":"3S x 10-12W, Halten je 3-5 s · 2 s anspannen, 3-5 s halten, 2 s lösen · 2-3 x / Woche","kurz":"3S x 10-12W, Halten je 3-5 s","hinweis":"Ellbogen beugen statt aus dem Schulterblatt zu arbeiten, Hochziehen der Schultern statt Herunterziehen, Luft anhalten","bilder":[],"video":""},{"id":"SCG-ELE-DEH-MUS-01","name":"Dehnung des oberen Trapezius und Levator scapulae","instruktion":"Zieh deine Schulter aktiv nach unten und neig deinen Kopf zur anderen Seite, bis es seitlich am Hals zieht. Für eine tiefere Dehnung den Blick zusätzlich leicht Richtung Achsel der Gegenseite drehen.","dosis":"3 x 30-45 s je Seite · statisch · täglich","kurz":"3 x 30-45 s je Seite","hinweis":"zu starker Zug am Kopf statt aktivem Herunterziehen der Schulter, ruckartige Bewegung","bilder":[],"video":""},{"id":"SCG-ELE-KRA-MUS-01","name":"Schulterblatt-Elevation Kräftigung (Shrugs mit Kurzhanteln)","instruktion":"Zieh deine Schultern gerade nach oben, als würdest du sie zu deinen Ohren ziehen wollen, halte kurz und lass sie dann langsam wieder sinken.","dosis":"3S x 12-15W · 2 s hoch, 1 s halten, 2 s runter · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"Rollbewegung der Schultern statt gerader Auf-Ab-Bewegung, Kopf schiebt nach vorne, zu schwere Last mit Schwung","bilder":[],"video":""},{"id":"SCG-PTI-KRA-MUS-01","name":"Posteriore Kippung Kräftigung, Y-Raise in Bauchlage","instruktion":"Heb deine Arme in der Y-Stellung ein kleines Stück vom Boden ab und stell dir vor, du ziehst dabei deine Schulterblätter nach hinten unten in die Gesäßtaschen.","dosis":"3S x 10-12W · 2 s hoch, 1 s halten, 2 s runter · 2-3 x / Woche","kurz":"3S x 10-12W","hinweis":"Kompensation über den oberen Trapezius (Schulterhochzug), zu große Anhebehöhe mit Schwung, Überstreckung der Halswirbelsäule","bilder":[],"video":""},{"id":"SCG-PTR-DEH-MUS-01","name":"Pectoralis-minor-Dehnung","instruktion":"Leg dich mit der Rolle unter der Wirbelsäule hin und lass deine Schultern einfach durch ihr eigenes Gewicht nach unten Richtung Boden sinken, bis es vorne unter dem Schlüsselbein zieht.","dosis":"1-2 x 2-3 min · statisch, passiv · täglich","kurz":"1-2 x 2-3 min","hinweis":"aktives Herunterdrücken der Schultern statt die Schwerkraft wirken zu lassen, zu dünne oder instabile Rolle","bilder":[],"video":""},{"id":"SCG-PTR-KOO-SON-01","name":"Scapula-alata-Kontrolle, Wandliegestütz-Halten","instruktion":"Drück deine Hände gegen die Wand, sodass deine Schulterblätter flach an deinem Rücken anliegen und nicht abstehen. Halte diese Position ruhig.","dosis":"3S x 20-30 s · isometrisch haltend · täglich bis 3 x / Woche","kurz":"3S x 20-30 s","hinweis":"Schulterblatt hebt weiterhin ab (Scapula alata bleibt sichtbar), Kompensation über den oberen Trapezius statt den Serratus anterior einzusetzen","bilder":[],"video":""},{"id":"SCG-PTR-KRA-MUS-01","name":"Protraktion Kräftigung, Serratus-Punch","instruktion":"Streck deinen Arm nach vorne oben und schieb dann deine Faust noch ein kleines Stück weiter nach vorne, als würdest du gegen etwas boxen. Dein Schulterblatt bewegt sich dabei mit nach vorne.","dosis":"3S x 12-15W je Seite · 2 s vor, 2 s zurück · 2-3 x / Woche","kurz":"3S x 12-15W je Seite","hinweis":"Bewegung nur aus dem Ellbogen statt aus dem Schulterblatt, Ausweichen über Rumpfrotation","bilder":[],"video":""},{"id":"SCG-RTR-KRA-MUS-01","name":"Retraktion Kräftigung, Rudern im Sitz","instruktion":"Zieh deine Ellbogen gegen das Band nach hinten und bring deine Schulterblätter dabei aktiv zueinander, dann langsam wieder nach vorne.","dosis":"3S x 12-15W · 2 s zurück, 2 s vor · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"Hochziehen der Schultern statt reiner Retraktion, Hohlkreuz, zu starkes Zusammenpressen der Schulterblätter über das normale Maß hinaus","bilder":[],"video":""},{"id":"SCG-SIR-KOO-BAN-01","name":"Propriozeptive Kontrolle der Skapula-Rotation im Vierfüßlerstand","instruktion":"Lass deinen Oberkörper zwischen deinen Schulterblättern langsam nach unten sinken und drück dich dann wieder aktiv nach oben, ohne die Arme zu beugen.","dosis":"3S x 10-12 Wiederholungen · langsam, ca. 3 s pro Richtung · 2-3 x / Woche","kurz":"3S x 10-12 Wiederholungen","hinweis":"Ellbogen beugen statt reiner Schulterblattbewegung, Hohlkreuz oder Rundrücken als Ausweichbewegung","bilder":[],"video":""},{"id":"SCH-ABD-KOO-BAN-01","name":"Propriozeptives Wandtraining, skapulohumeraler Rhythmus","instruktion":"Lass deine Hand langsam an der Wand nach oben gleiten und achte darauf, dass sich dein Schulterblatt gleichmäßig mitbewegt, nicht ruckartig springt.","dosis":"3S x 10 Wiederholungen, alternativ 3S x 20-30 s Halten mit kleinen Kreisen · langsam und kontrolliert · 2-3 x / Woche","kurz":"3S x 10 Wiederholungen, alternativ 3S x 20-30 s Halten mit kleinen Kreisen","hinweis":"Hochziehen der Schulter statt gleichmäßigen Gleitens, zu schnelles Tempo, Ausweichen über Rumpfneigung","bilder":[],"video":""},{"id":"SCH-ABD-KRA-MUS-01","name":"Abduktionskräftigung, seitliches Heben","instruktion":"Heb deine Arme seitlich bis auf Schulterhöhe an und lass sie dann langsam wieder sinken. Nicht höher als bis zur Schulter.","dosis":"3S x 10-15W · 2 s hoch, 2 s runter · 2-3 x / Woche","kurz":"3S x 10-15W","hinweis":"über Schulterhöhe hinaus anheben (erhöht das Einklemmrisiko unter dem Schulterdach), Hochziehen der Schulter, Schwungholen","bilder":[],"video":""},{"id":"SCH-ABD-KRA-SEH-01","name":"Isometrische Abduktion in schmerzarmem Winkel (Stufe 1 Rotatorenmanschette)","instruktion":"Drück deinen Arm gegen den Widerstand nach außen und halte die Spannung ruhig, in einer Position, die sich nicht schmerzhaft anfühlt.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, konstante Spannung · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Ausführung im schmerzhaften Winkelbereich (Painful Arc) statt in einer schmerzarmen Position, Hochziehen der Schulter, zu hohe Intensität von Beginn an","bilder":[],"video":""},{"id":"SCH-ABD-KRA-SEH-02","name":"Heavy Slow Resistance seitliches Heben 'Full Can' (Stufe 2 Rotatorenmanschette)","instruktion":"Heb deine Arme mit nach oben zeigenden Daumen langsam seitlich an, bis maximal zur Schulterhöhe, und senk sie genauso langsam wieder ab.","dosis":"3-4S x 6-15W, Last nach Wochenplan steigern: Woche 1 = 15RM, Woche 2-3 = 12RM, Woche 4-5 = 10RM, Woche 6-8 = 8RM, Woche 9-12 = 6RM · 3 s konzentrisch - 1 s halten - 3 s exzentrisch · 3 x / Woche, mindestens 48 h Abstand","kurz":"3-4S x 6-15W, Last nach Wochenplan steigern: Woche 1 = 15RM, Woche 2-3 = 12RM, Woche 4-5 = 10RM, Woche 6-8 = 8RM, Woche 9-12 = 6RM","hinweis":"Ausführung mit Daumen nach unten (erhöht in vielen Fällen die subakromiale Kompression), Bewegung in den schmerzhaften Bereich hinein, Hochziehen der Schulter, zu schnelles Tempo","bilder":[],"video":""},{"id":"SCH-ABD-KRA-SEH-03","name":"Energiespeicher-Belastung: Plyo-Ball-Wurf gegen die Wand (Stufe 3 Rotatorenmanschette)","instruktion":"Wirf den Ball gegen die Wand und fang ihn direkt wieder auf, um ihn gleich erneut zu werfen - ein fließender, zügiger Rhythmus.","dosis":"4-6S x 15-20 Würfe · reaktiv, kurze Kontaktzeit beim Abfangen · 2 x / Woche, mindestens 48 h Abstand zu anderer Sehnenbelastung","kurz":"4-6S x 15-20 Würfe","hinweis":"zu große Wurfdistanz/-kraft von Beginn an, unkontrolliertes Abfangen, direkt nach der Stufe-2-Einheit ausgeführt","bilder":[],"video":""},{"id":"SCH-ABD-KRA-SEH-04","name":"Sportartspezifische Belastungsrückführung (Stufe 4 Rotatorenmanschette)","instruktion":"Wir bauen die Wurfbelastung in kleinen Schritten auf. Jede Steigerung wird am nächsten Morgen überprüft.","dosis":"individuell nach Sportart und Trainingsplan · sportartspezifisch · 2-3 x / Woche intensiv","kurz":"individuell nach Sportart und Trainingsplan","hinweis":"zu schneller Umfangsaufbau, Rückkehr ohne bestandene Testbatterie, Vernachlässigung der Erhaltungsdosis aus Stufe 2","bilder":[],"video":""},{"id":"SCH-ABD-KRA-SEH-05","name":"Drop & Catch – reaktives Auffangen eines fallenden Gewichts (Stufe 3 Rotatorenmanschette, Variante)","instruktion":"Halt deine Hand offen in Position. Dein Partner lässt ohne Ankündigung ein leichtes Gewicht hineinfallen - fang es und bremse die Bewegung sofort ab, ohne dass dein Arm stark einsackt.","dosis":"4-5S x 8-10 Wiederholungen · reaktiv, unvorhersehbarer Zeitpunkt des Fallenlassens · 1-2 x / Woche, mindestens 48 h Abstand zu anderer intensiver Sehnenbelastung","kurz":"4-5S x 8-10 Wiederholungen","hinweis":"zu große Fallhöhe oder zu schweres Gewicht von Beginn an, angekündigtes/vorhersehbares Fallenlassen (nimmt der Übung die reaktive Komponente), Arm sackt deutlich durch statt abzubremsen","bilder":[],"video":""},{"id":"SCH-ABD-KRA-SEH-06","name":"Drop & Catch in Eigenregie, Selbstauslösung mit der freien Hand (Stufe 3 Rotatorenmanschette, Heimvariante)","instruktion":"Halt das Gewicht mit deiner freien Hand knapp über deiner geöffneten anderen Hand. Schau kurz weg oder zähl innerlich unregelmäßig, dann lass los, ohne dir den genauen Moment vorher zu überlegen. Die andere Hand fängt und bremst sofort ab.","dosis":"4-5S x 8-10 Wiederholungen · reaktiv, bewusst unregelmäßiger Auslösemoment · 1-2 x / Woche, mindestens 48 h Abstand zu anderer intensiver Sehnenbelastung","kurz":"4-5S x 8-10 Wiederholungen","hinweis":"immer im gleichen Rhythmus oder Zählmuster loslassen (macht die Übung vorhersehbar und nimmt den reaktiven Trainingsreiz), Blick bleibt durchgehend auf das Gewicht gerichtet statt kurz wegzuschauen, zu hastiges Loslassen ohne Kontrolle über die Fallhöhe","bilder":[],"video":""},{"id":"SCH-ADD-KRA-MUS-01","name":"Adduktionskräftigung, Zugbewegung von oben nach unten","instruktion":"Zieh deinen gestreckten Arm gegen das Band von oben nach unten zu deiner Körperseite und lass ihn dann langsam wieder nach oben gleiten.","dosis":"3S x 10-15W je Seite · 2 s runter, 2 s rauf · 2-3 x / Woche","kurz":"3S x 10-15W je Seite","hinweis":"Ausweichen über Rumpfrotation, Schwungholen, unvollständige Bewegungsamplitude","bilder":[],"video":""},{"id":"SCH-ADD-KRA-MUS-02","name":"Isometrische Schulteradduktion gegen ein Kissen (Frühphase)","instruktion":"Klemm ein kleines Kissen zwischen deinen Oberarm und deinen Körper. Drück den Oberarm gegen das Kissen an den Körper - dabei bewegt sich nichts. Halte die Spannung ruhig und atme weiter. Die Schulter bleibt locker unten.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Schulter wird hochgezogen oder rollt nach vorne","bilder":[],"video":""},{"id":"SCH-ADD-KRA-MUS-03","name":"Klimmzug (Pull-up im Obergriff, Chin-up im Untergriff)","instruktion":"Häng dich mit gestreckten Armen an die Stange. Zieh zuerst die Schultern nach unten, weg von den Ohren. Zieh dich dann hoch, bis dein Kinn über der Stange ist. Lass dich langsam wieder ganz ab und hol keinen Schwung mit den Beinen.","dosis":"3-4S x 3-8W · 1-2 s hochziehen, 2-3 s ablassen · 2 x / Woche","kurz":"3-4S x 3-8W","hinweis":"Schwung aus Beinen und Hüfte (Kipping)","bilder":[],"video":""},{"id":"SCH-ADD-KRA-MUS-04","name":"Latzug an der Maschine (Lat Pulldown)","instruktion":"Setz dich an die Maschine und greif die Stange etwas breiter als schulterbreit. Zieh zuerst die Schultern nach unten und dann die Stange vor dem Gesicht zur Brust. Lass sie langsam wieder nach oben, bis die Arme gestreckt sind. Zieh nie hinter den Kopf.","dosis":"3S x 8-12W · 2 s ziehen, 1 s halten, 3 s zurück · 2 x / Woche","kurz":"3S x 8-12W","hinweis":"Ziehen hinter den Nacken","bilder":[],"video":""},{"id":"SCH-AR0-DEH-MUS-01","name":"Sleeper Stretch – Dehnung der posterioren Rotatorenmanschette","instruktion":"Leg dich auf die betroffene Schulter, beug den Ellbogen und drück mit der anderen Hand sanft deinen Unterarm Richtung Boden, bis es hinten in der Schulter zieht.","dosis":"3 x 30-45 s · statisch · täglich, besonders nach Wurfbelastung","kurz":"3 x 30-45 s","hinweis":"zu starker Druck, Schulterblatt kippt mit statt stabil zu bleiben, Rumpfrotation als Ausweichbewegung","bilder":[],"video":""},{"id":"SCH-AR0-KRA-MUS-01","name":"Außenrotation bei 0 Grad Abduktion gegen Band","instruktion":"Dreh deinen Unterarm gegen das Band nach außen, dein Ellbogen bleibt dabei fest an deinem Körper. Dann langsam wieder zurück.","dosis":"3S x 12-15W je Seite · 2 s hin, 2 s zurück · 2-3 x / Woche","kurz":"3S x 12-15W je Seite","hinweis":"Ellbogen löst sich vom Körper, Ausweichen über den Rumpf, zu große Bewegungsamplitude mit Schwung","bilder":[],"video":""},{"id":"SCH-AR0-KRA-SEH-01","name":"Außenrotation in Seitlage mit Kurzhantel, langsam und schwer (hintere Rotatorenmanschette, Stufe 2)","instruktion":"Leg dich auf die gesunde Seite, dein oberer Ellbogen liegt mit einem kleinen Handtuch am Körper. Dreh die Hantel langsam nach oben und lass sie genauso langsam wieder sinken. Der Ellbogen bleibt am Körper, dein Oberkörper dreht nicht mit.","dosis":"3-4S x 6-15W nach Wochenprogression wie bei anderen Sehnen (15RM bis 6RM über mehrere Wochen) · 3 s konzentrisch / 3 s exzentrisch · 3 x / Woche mit mindestens 48 h Abstand","kurz":"3-4S x 6-15W nach Wochenprogression wie bei anderen Sehnen (15RM bis 6RM über mehrere Wochen)","hinweis":"Ellbogen löst sich vom Körper","bilder":[],"video":""},{"id":"SCH-AR0-KRA-SEH-02","name":"Isometrische Außenrotation gegen die Wand (Infraspinatus / hintere Rotatorenmanschette)","instruktion":"Stell dich seitlich an eine Wand. Dein Ellbogen ist gebeugt und liegt mit einem kleinen Handtuch am Körper, der Handrücken berührt die Wand. Drück die Hand nach außen gegen die Wand - dabei bewegt sich nichts. Halte die Spannung ruhig und atme weiter.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Ellbogen löst sich vom Körper","bilder":[],"video":""},{"id":"SCH-AR9-KOO-BAN-01","name":"Propriozeptives Training in wurfnaher Position (Apprehension-nahe Stellung)","instruktion":"Halt deinen Arm in der Wurfausholposition und versuch, kleine Störungen - zum Beispiel einen leichten Ball, den du fängst und wirfst - zu kontrollieren, ohne dass sich deine Schulterposition verändert.","dosis":"3S x 20-30 s Halten mit Störreizen, alternativ 3S x 8-10 Ball-Fang-Wurf-Wiederholungen · kontrolliert, mit Störreiz auch reaktiv · 2-3 x / Woche","kurz":"3S x 20-30 s Halten mit Störreizen, alternativ 3S x 8-10 Ball-Fang-Wurf-Wiederholungen","hinweis":"zu früher Einsatz ohne ausreichende Kraftbasis aus den vorherigen Übungen, zu große oder unvorhersehbare Störreize von Beginn an, Position wird bei Ermüdung nicht mehr sauber gehalten","bilder":[],"video":""},{"id":"SCH-AR9-KRA-MUS-01","name":"Außenrotation bei 90 Grad Abduktion, Wurfkraft exzentrisch betont","instruktion":"Bring deinen Unterarm gegen das Band nach hinten, wie beim Ausholen zum Wurf, und lass ihn dann langsam und kontrolliert wieder nach vorne kommen.","dosis":"3S x 10-12W je Seite · 2 s nach hinten, 3-4 s kontrolliert zurück (betont exzentrisch) · 2-3 x / Woche","kurz":"3S x 10-12W je Seite","hinweis":"Ellbogen sinkt unter Schulterhöhe ab, zu schnelle unkontrollierte Rückführung, Ausweichen über den Rumpf","bilder":[],"video":""},{"id":"SCH-EXT-DEH-MUS-01","name":"Latissimus-Dehnung über Kopf","instruktion":"Leg deine Arme gestreckt auf die Bank und lass dein Becken nach hinten unten sinken, bis es seitlich unter dem Arm zieht.","dosis":"3 x 30-45 s · statisch · täglich","kurz":"3 x 30-45 s","hinweis":"Hohlkreuz statt Beckenkippung, Schultern hochziehen","bilder":[],"video":""},{"id":"SCH-EXT-KRA-MUS-01","name":"Schulterextension Kräftigung, Rudern am Band","instruktion":"Zieh deine gestreckten Arme gegen das Band nach hinten, bis sie neben deinem Körper sind, und lass sie dann langsam wieder nach vorne gleiten.","dosis":"3S x 10-15W · 2 s zurück, 2 s vor · 2-3 x / Woche","kurz":"3S x 10-15W","hinweis":"Schwungholen, Hohlkreuz, Schultern hochziehen statt Schulterblätter aktiv einzusetzen","bilder":[],"video":""},{"id":"SCH-EXT-KRA-MUS-02","name":"Isometrische Schulterextension gegen die Wand (Rückwärtsdruck, Frühphase)","instruktion":"Stell dich mit dem Rücken vor eine Wand. Dein Ellbogen ist gebeugt, liegt seitlich am Körper und berührt hinten die Wand. Drück den Ellbogen nach hinten gegen die Wand - dabei bewegt sich nichts. Halte die Spannung ruhig und atme weiter. Die Schulter bleibt unten, du machst kein Hohlkreuz.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Schulter kippt nach vorne","bilder":[],"video":""},{"id":"SCH-EXT-KRA-MUS-03","name":"Langhantelrudern vorgebeugt (Bent-over Row)","instruktion":"Beug dich mit geradem Rücken aus der Hüfte nach vorn, die Knie sind leicht gebeugt. Zieh die Stange zum Bauch und die Schulterblätter zusammen. Lass sie langsam wieder sinken. Dein Oberkörper bleibt dabei ruhig und richtet sich nicht auf.","dosis":"3-4S x 6-10W · 1-2 s ziehen, 2 s ablassen · 2 x / Woche","kurz":"3-4S x 6-10W","hinweis":"Oberkörper richtet sich beim Ziehen auf (Schwung)","bilder":[],"video":""},{"id":"SCH-EXT-KRA-MUS-04","name":"Einarmiges Kurzhantelrudern mit Abstützen (One-arm Dumbbell Row)","instruktion":"Stütz dich mit einer Hand und einem Knie auf der Bank ab, der Rücken ist gerade. Zieh die Hantel mit dem anderen Arm Richtung Hüfte, der Ellbogen bleibt nah am Körper. Lass sie langsam wieder sinken, bis der Arm gestreckt ist. Dein Oberkörper dreht dabei nicht mit.","dosis":"3S x 8-12W je Seite · 2 s ziehen, 1 s halten, 2 s ablassen · 2-3 x / Woche","kurz":"3S x 8-12W je Seite","hinweis":"Rumpf dreht beim Ziehen auf","bilder":[],"video":""},{"id":"SCH-FLX-DEH-MUS-01","name":"Brustmuskeldehnung im Türrahmen","instruktion":"Stütz deinen Unterarm im Türrahmen ab und lehn dich langsam nach vorne durch die Tür, bis es vorne in der Brust zieht.","dosis":"3 x 30-45 s je Seite · statisch · täglich","kurz":"3 x 30-45 s je Seite","hinweis":"Ellbogenhöhe zu hoch oder zu tief (verändert die Zielstruktur ungünstig), Ausweichen ins Hohlkreuz, zu forsches Nachvornelehnen","bilder":[],"video":""},{"id":"SCH-FLX-KRA-KNO-01","name":"Gewichttragende Liegestütz-Variante an der Wand","instruktion":"Stütz dich an der Wand ab und beug die Ellbogen, um deinen Oberkörper Richtung Wand zu senken, dann drück dich wieder kräftig zurück. Der Körper bleibt dabei wie ein Brett gerade.","dosis":"3S x 10-15W · 2 s absenken, 1 s halten, 2 s drücken · 2-3 x / Woche","kurz":"3S x 10-15W","hinweis":"Durchhängen im unteren Rücken, Schulterblätter kneifen sich zusammen statt frei zu gleiten, zu große Ellbogenbeugung","bilder":[],"video":""},{"id":"SCH-FLX-KRA-MUS-01","name":"Schulterflexion Kräftigung, Frontheben mit Band","instruktion":"Heb deinen gestreckten Arm gegen das Band nach vorne bis auf Schulterhöhe an und lass ihn dann langsam wieder sinken. Kein Schwung aus dem Rücken.","dosis":"3S x 10-15W · 2 s hoch, 2 s runter · 2-3 x / Woche","kurz":"3S x 10-15W","hinweis":"Schwungholen aus dem Rumpf, Hochziehen der Schulter Richtung Ohr, über Schulterhöhe hinaus anheben","bilder":[],"video":""},{"id":"SCH-FLX-KRA-MUS-02","name":"Schulterdrücken stehend mit der Langhantel (Overhead Press)","instruktion":"Halt die Stange vorn auf den Schultern, die Hände knapp schulterbreit. Spann Bauch und Po fest an. Drück die Stange gerade nach oben, nimm dabei den Kopf kurz zurück und schieb ihn oben wieder unter die Stange. Geh nicht ins Hohlkreuz. Senk die Stange kontrolliert wieder ab.","dosis":"3-4S x 5-8W · kräftig drücken, 2 s ablassen · 2 x / Woche","kurz":"3-4S x 5-8W","hinweis":"Hohlkreuz und Zurücklehnen","bilder":[],"video":""},{"id":"SCH-FLX-KRA-MUS-03","name":"Schulterdrücken mit Kurzhanteln (Dumbbell Shoulder Press)","instruktion":"Setz dich aufrecht hin und halt die Hanteln auf Schulterhöhe, die Ellbogen zeigen leicht nach vorn. Drück die Hanteln nach oben, bis die Arme gestreckt sind. Senk sie dann langsam wieder auf Schulterhöhe ab. Der Rücken bleibt an der Lehne, kein Hohlkreuz.","dosis":"3S x 8-12W · 2 s drücken, 2-3 s ablassen · 2 x / Woche","kurz":"3S x 8-12W","hinweis":"Hohlkreuz","bilder":[],"video":""},{"id":"SCH-FLX-KRA-SEH-01","name":"Langsame Bizeps-Curls mit Supination (lange Bizepssehne, Stufe 2)","instruktion":"Heb die Hantel mit der Handfläche nach vorne langsam an, bis dein Ellbogen gebeugt ist, und lass sie genauso langsam wieder sinken. Dein Oberarm bleibt am Körper, kein Schwung aus dem Oberkörper.","dosis":"3-4S x 6-15W nach Wochenprogression wie bei anderen Sehnen (15RM bis 6RM über mehrere Wochen) · 3 s konzentrisch / 3 s exzentrisch · 3 x / Woche mit mindestens 48 h Abstand","kurz":"3-4S x 6-15W nach Wochenprogression wie bei anderen Sehnen (15RM bis 6RM über mehrere Wochen)","hinweis":"Schwungholen aus der Schulter, Hochziehen der Schulter als Kompensation, zu schnelles Tempo","bilder":[],"video":""},{"id":"SCH-FLX-KRA-SEH-02","name":"Isometrische Schulterflexion gegen die Wand (lange Bizepssehne / vordere Schulter)","instruktion":"Stell dich vor eine Wand und leg die Handfläche deines gestreckten Arms schräg vor dir an die Wand, ungefähr auf Höhe deines Bauchnabels. Die Finger zeigen nach unten, der Daumen nach außen. Drück den Arm nach vorne in die Wand, als wolltest du ihn anheben - dabei bewegt sich nichts. Halte die Spannung ruhig und atme weiter. Die Schulter bleibt unten und du lehnst dich nicht mit dem Körper an.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Lehnen mit dem Körpergewicht in die Wand statt Druck aus der Schulter","bilder":[],"video":""},{"id":"SCH-FLX-MOB-KRP-01","name":"Pendelübungen nach Codman","instruktion":"Lass deinen Arm locker hängen und bring ihn durch ein leichtes Wiegen deines Oberkörpers in kleine Schwünge - vor und zurück, zur Seite, im Kreis. Der Arm selbst bleibt ganz entspannt.","dosis":"3S x 20-30 s je Richtung · langsam, locker schwingend · mehrmals täglich, besonders in der akuten Phase","kurz":"3S x 20-30 s je Richtung","hinweis":"aktives Anheben des Arms statt passives Schwingen, zu große Amplitude von Beginn an, Anspannung der Schulter statt Loslassen","bilder":[],"video":""},{"id":"SCH-HAB-KRA-MUS-01","name":"Horizontalabduktion Kräftigung, Reverse Fly am Band","instruktion":"Führ deine Arme gegen das Band nach hinten außen, als würdest du deine Schulterblätter sanft zusammenziehen, dann langsam wieder nach vorne.","dosis":"3S x 12-15W · 2 s hin, 2 s zurück · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"Schwungholen, Hochziehen der Schultern statt Zusammenziehen der Schulterblätter, Hohlkreuz durch zu starkes Vorbeugen","bilder":[],"video":""},{"id":"SCH-HAB-KRA-MUS-02","name":"Face Pull am Kabelzug oder Band","instruktion":"Greif das Seil mit beiden Händen und geh einen Schritt zurück. Zieh das Seil zum Gesicht, die Ellbogen gehen dabei hoch und zur Seite. Dreh am Ende die Hände nach hinten, als würdest du deine Oberarmmuskeln zeigen. Halte kurz und lass das Seil langsam zurück.","dosis":"3S x 12-15W · 2 s ziehen, 1 s halten, 2 s zurück · 2-3 x / Woche","kurz":"3S x 12-15W","hinweis":"Ellbogen fallen nach unten, die Übung wird zum Rudern","bilder":[],"video":""},{"id":"SCH-HAD-DEH-MUS-01","name":"Cross-Body-Dehnung (horizontale Adduktion)","instruktion":"Zieh deinen gestreckten Arm mit der anderen Hand sanft vor deinem Körper zur Gegenseite, bis es hinten in der Schulter zieht. Die Schulter bleibt dabei unten.","dosis":"3 x 30-45 s je Seite · statisch · täglich, besonders nach Wurfbelastung","kurz":"3 x 30-45 s je Seite","hinweis":"Hochziehen der Schulter während des Zugs, zu starker Zug, Rumpfrotation als Ausweichbewegung","bilder":[],"video":""},{"id":"SCH-HAD-KRA-MUS-01","name":"Bankdrücken mit der Langhantel (Bench Press)","instruktion":"Leg dich so auf die Bank, dass deine Augen unter der Stange sind, und stell die Füße fest auf den Boden. Zieh die Schulterblätter zusammen und nach unten. Senk die Stange langsam zur Brust ab, die Ellbogen zeigen schräg nach unten und nicht zur Seite. Drück sie dann wieder nach oben, ohne sie von der Brust abprallen zu lassen. Drück nie ohne Sicherung schwer.","dosis":"3-4S x 6-10W · 2-3 s ablassen, kurz an der Brust, kräftig drücken · 2 x / Woche","kurz":"3-4S x 6-10W","hinweis":"Ellbogen rechtwinklig zur Seite abgespreizt","bilder":[],"video":""},{"id":"SCH-HAD-KRA-MUS-02","name":"Bankdrücken mit Kurzhanteln, flach und schräg (Dumbbell Press)","instruktion":"Leg dich mit den Hanteln auf die Bank und drück sie über der Brust nach oben. Senk sie langsam seitlich neben die Brust ab, die Unterarme bleiben senkrecht. Drück sie dann wieder nach oben. Wenn deine Schulter empfindlich ist, dreh die Handflächen zueinander und geh nicht ganz so tief.","dosis":"3S x 8-12W · 2-3 s ablassen, 1-2 s drücken · 2 x / Woche","kurz":"3S x 8-12W","hinweis":"Hanteln zu tief, die Schulter rollt nach vorn","bilder":[],"video":""},{"id":"SCH-HAD-KRA-MUS-03","name":"Liegestütz (Push-up)","instruktion":"Stütz die Hände etwas breiter als schulterbreit auf. Dein Körper ist von Kopf bis Fuß gerade wie ein Brett. Senk die Brust bis knapp über den Boden ab und drück dich wieder hoch. Die Ellbogen zeigen schräg nach hinten, nicht zur Seite. Der Po bleibt in Linie.","dosis":"3S x 8-15W · 2 s ablassen, 1 s drücken · 2-3 x / Woche","kurz":"3S x 8-15W","hinweis":"Becken hängt durch","bilder":[],"video":""},{"id":"SCH-HAD-KRA-MUS-04","name":"Fliegende mit Kurzhanteln oder am Kabel (Fly / Butterfly)","instruktion":"Leg dich mit den Hanteln auf die Bank, die Arme sind leicht gebeugt über der Brust. Öffne die Arme langsam in einem großen Bogen zur Seite, bis du vorn in der Brust eine Dehnung spürst. Führ sie im gleichen Bogen wieder zusammen. Die Ellbogen bleiben die ganze Zeit leicht gebeugt.","dosis":"3S x 10-15W · 3 s öffnen, 2 s schließen · 2 x / Woche","kurz":"3S x 10-15W","hinweis":"Zu tief absenken mit Druck vorn in der Schulter","bilder":[],"video":""},{"id":"SCH-HAD-KRA-SEH-01","name":"Isometrische Horizontaladduktion am Türrahmen (Pectoralis-major-Sehne / vordere Schulter)","instruktion":"Stell dich vor einen Türrahmen und heb deinen Arm vor dem Körper auf Brusthöhe, der Ellbogen ist leicht gebeugt. Die Innenseite deiner Hand liegt am Rahmen. Drück die Hand nach innen gegen den Rahmen - dabei bewegt sich nichts. Halte die Spannung ruhig und atme weiter. Die Schulter bleibt unten.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Schulter schiebt nach vorne oder wird hochgezogen","bilder":[],"video":""},{"id":"SCH-IR0-DEH-MUS-01","name":"Subscapularis-Dehnung im Türrahmen, Außenrotationsposition","instruktion":"Stütz deinen Unterarm am Türrahmen ab und dreh deinen Körper langsam davon weg, bis es vorne an der Schulter zieht.","dosis":"3 x 30-45 s je Seite · statisch · täglich","kurz":"3 x 30-45 s je Seite","hinweis":"zu forsches Drehen, Ausweichen über Rumpfrotation statt reiner Schulterbewegung","bilder":[],"video":""},{"id":"SCH-IR0-KRA-MUS-01","name":"Innenrotation bei 0 Grad Abduktion gegen Band","instruktion":"Dreh deinen Unterarm gegen das Band vor deinen Bauch, dein Ellbogen bleibt dabei fest an deinem Körper. Dann langsam wieder zurück.","dosis":"3S x 12-15W je Seite · 2 s hin, 2 s zurück · 2-3 x / Woche","kurz":"3S x 12-15W je Seite","hinweis":"Ellbogen löst sich vom Körper, Ausweichen über den Rumpf","bilder":[],"video":""},{"id":"SCH-IR0-KRA-SEH-01","name":"Isometrische Innenrotation am Türrahmen (Subscapularis / vordere Schulter)","instruktion":"Stell dich vor einen Türrahmen. Dein Ellbogen ist gebeugt und liegt mit einem kleinen Handtuch am Körper, der Daumen zeigt nach oben und die Handfläche liegt innen am Rahmen. Drück die Hand nach innen gegen den Rahmen, als wolltest du den Unterarm zum Bauch drehen - dabei bewegt sich nichts. Halte die Spannung ruhig und atme weiter.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Ellbogen löst sich vom Körper","bilder":[],"video":""},{"id":"SCH-IR9-KRA-MUS-01","name":"Innenrotation bei 90 Grad Abduktion, Wurfbewegung Beschleunigungsphase","instruktion":"Bring deinen Unterarm gegen das Band zügig von hinten nach vorne, wie bei der Wurfbewegung selbst, und führ ihn dann kontrolliert wieder zurück.","dosis":"3S x 10-12W je Seite · zügig-explosiv nach vorne, 2-3 s kontrolliert zurück · 2-3 x / Woche","kurz":"3S x 10-12W je Seite","hinweis":"Ellbogen sinkt ab, Ausweichen über Rumpfrotation statt reiner Schulterbewegung, unkontrollierte Rückführung","bilder":[],"video":""},{"id":"SCH-ZIR-KOO-BAN-01","name":"Kontrolliertes Schulterkreisen in alle Richtungen (Shoulder CARs)","instruktion":"Zieh mit deinem Arm einen möglichst großen, langsamen Kreis in der Luft, so kontrolliert wie möglich, ohne dass dein Oberkörper mitschwingt.","dosis":"2S x 5 Kreise je Richtung und Seite · sehr langsam, ca. 8-10 s pro vollem Kreis · 2-4 x / Woche","kurz":"2S x 5 Kreise je Richtung und Seite","hinweis":"zu schnelles Tempo, Mitschwingen des Rumpfes, unvollständige Amplitude aus Bequemlichkeit","bilder":[],"video":""},{"id":"SPG-DEX-DEH-MUS-01","name":"Wadendehnung Wandstand, Knie gestreckt (Gastrocnemius)","instruktion":"Hinteres Knie durchgestreckt lassen, Ferse bleibt am Boden, Becken nach vorne schieben. Ziehen soll oben in der Wade sein, nicht in der Ferse.","dosis":"3 Wiederholungen x 30-45 s je Seite · statisch haltend · täglich bis 2 x täglich","kurz":"3 Wiederholungen x 30-45 s je Seite","hinweis":"Fuß dreht nach außen, Ferse hebt ab, Hohlkreuz, Knie unbemerkt gebeugt","bilder":[],"video":""},{"id":"SPG-DEX-DEH-MUS-02","name":"Wadendehnung Knie gebeugt (Soleus)","instruktion":"Hinteres Knie leicht beugen und dich Richtung Boden sinken lassen. Das Ziehen soll jetzt tiefer sitzen, kurz oberhalb der Ferse.","dosis":"3 x 30-45 s je Seite · statisch · täglich","kurz":"3 x 30-45 s je Seite","hinweis":"Ferse hebt ab, Ausweichen in Pronation","bilder":[],"video":""},{"id":"SPG-DEX-KRA-MUS-01","name":"Fersenstand / Zehenheben gegen Widerstand","instruktion":"Zieh die Fußspitze zu dir heran und etwas nach innen, dann ganz langsam wieder zurück.","dosis":"3S x 12-15W · 2 s konzentrisch - 1 s halten - 3 s exzentrisch · 3 x / Woche","kurz":"3S x 12-15W","hinweis":"Ausweichen über Hüftflexion","bilder":[],"video":""},{"id":"SPG-DEX-KRA-SEH-01","name":"Isometrische Dorsalextension gegen Widerstand (Tibialis-anterior-Sehne, Stufe 1)","instruktion":"Setz dich auf einen Stuhl und stell die Ferse auf den Boden. Leg die Ferse deines anderen Fußes von oben auf deinen Fußrücken. Zieh den Fuß nach oben, der andere Fuß hält dagegen - dabei bewegt sich nichts. Die Zehen bleiben locker. Halte die Spannung ruhig und atme weiter.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Zehen ziehen mit hoch statt locker zu bleiben","bilder":[],"video":""},{"id":"SPG-DEX-MOB-BAN-01","name":"Knee-to-Wall Mobilisation (Ausfallschritt zur Wand)","instruktion":"Schieb das Knie geradeaus Richtung Wand, ohne dass die Ferse abhebt. Sobald die Ferse sich löst, bist du zu weit.","dosis":"3S x 10-15W, endgradig jeweils 3-5 s halten · langsam, 3 s hin - 3 s halten - 3 s zurück · täglich, in P1 auch 2 x täglich","kurz":"3S x 10-15W, endgradig jeweils 3-5 s halten","hinweis":"Ferse hebt ab","bilder":[],"video":""},{"id":"SPG-GEW-KRA-MUS-01","name":"Short Foot Exercise (Fußgewölbe aktiv aufrichten)","instruktion":"Zieh den Fußballen zur Ferse, ohne die Zehen einzurollen. Das Gewölbe hebt sich, der Fuß wird kürzer.","dosis":"3S x 10W mit je 5-10 s Haltezeit · langsam aufbauend, Spannung halten · täglich","kurz":"3S x 10W mit je 5-10 s Haltezeit","hinweis":"Zehen krallen (dann arbeitet der Flexor digitorum longus statt der intrinsischen Muskulatur)","bilder":[],"video":""},{"id":"SPG-GEW-KRA-SEH-01","name":"High-Load Wadenheben mit unterlegten Zehen (Plantarfaszie)","instruktion":"Die Zehen liegen auf dem Handtuch hochgestellt. Drei Sekunden hoch, zwei Sekunden oben halten, drei Sekunden runter.","dosis":"Start 3S x 12W, Steigerung über 4S x 10W und 5S x 8W bei gleichzeitig steigender Zusatzlast · 3 s konzentrisch - 2 s halten - 3 s exzentrisch · jeden 2. Tag","kurz":"Start 3S x 12W, Steigerung über 4S x 10W und 5S x 8W bei gleichzeitig steigender Zusatzlast","hinweis":"Zehen nicht ausreichend aufgestellt (dann trainiert man nur die Wade)","bilder":[],"video":""},{"id":"SPG-GEW-KRA-SEH-02","name":"Isometrisches Halten im Zehenstand mit unterlegten Zehen (Plantarfaszie, Stufe 1)","instruktion":"Leg ein zusammengerolltes Handtuch unter deine Zehen und halte dich leicht an einer Wand fest. Geh auf die Zehenspitzen, ungefähr bis zur Hälfte, und halte die Position ruhig - die Zehen bleiben auf dem Handtuch. Atme weiter und senk die Fersen am Ende langsam ab.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Zehen rutschen vom Handtuch oder werden eingekrallt","bilder":[],"video":""},{"id":"SPG-INV-KOO-BAN-01","name":"Einbeinstand mit Störreizen, progressiv (Bandpropriozeption)","instruktion":"Stell dich auf ein Bein, Fußgewölbe aktiv. Wenn du wackelst, fang dich über den Fuß ab, nicht über die Arme.","dosis":"4-6S x 30 s je Seite · statisch mit reaktiven Anteilen · täglich, mindestens 4 x / Woche über mindestens 6 Wochen","kurz":"4-6S x 30 s je Seite","hinweis":"Festhalten","bilder":[],"video":""},{"id":"SPG-PFL-KRA-KNO-01","name":"Impact-Serie: beidbeinige Sprünge zur Knochenstimulation","instruktion":"Zehn kraftvolle Sprünge, dann Pause. Lieber mehrmals am Tag kurz als einmal lange.","dosis":"4-5S x 10 Sprünge (ca. 40-50 Zyklen gesamt) · maximal reaktiv · täglich bis jeden 2. Tag - Mechanosensitivität des Knochens ist nach ca. 8 h wiederhergestellt","kurz":"4-5S x 10 Sprünge (ca. 40-50 Zyklen gesamt)","hinweis":"Zu viele Wiederholungen (Reiz sättigt nach 40-50 Zyklen), weiche Unterlage, gedämpfte Landung","bilder":[],"video":""},{"id":"SPG-PFL-KRA-MUS-01","name":"Wadenheben Kraftausdauer beidbeinig","instruktion":"So hoch wie möglich auf die Zehenspitzen, dann langsam ablassen.","dosis":"3S x 20-25W · 2 s / 1 s / 2 s · täglich bis 4 x / Woche","kurz":"3S x 20-25W","hinweis":"Nicht endgradig hoch, über die Außenkante ausweichen","bilder":[],"video":""},{"id":"SPG-PFL-KRA-MUS-02","name":"Isometrische Plantarflexion gegen die Wand im Langsitz (Wadenmuskel, Frühphase)","instruktion":"Setz dich mit gestreckten Beinen vor eine Wand, deine Fußsohle liegt an der Wand. Drück den Fußballen gegen die Wand, als würdest du Gas geben - dabei bewegt sich nichts. Halte die Spannung ruhig und atme weiter. Es darf sich anstrengend anfühlen, aber nicht wehtun.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Zu hohe Intensität zu früh","bilder":[],"video":""},{"id":"SPG-PFL-KRA-SEH-01","name":"Isometrisches Wadenheben, gehaltene Position (Stufe 1 Sehne)","instruktion":"Geh auf die Zehenspitzen und halte die Position ruhig. Kein Wippen. Atme normal weiter.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, konstante Spannung · 2 x täglich, jeden Tag; in der Reizphase bei Bedarf zusätzlich","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Wippen statt Halten, Luft anhalten, in Dorsalextension einsinken, Ausweichen über Pronation","bilder":[],"video":""},{"id":"SPG-PFL-KRA-SEH-02","name":"Heavy Slow Resistance Wadenheben, Knie gestreckt (Stufe 2 Sehne)","instruktion":"Drei Sekunden hoch, kurz oben halten, drei Sekunden runter. Die Bewegung muss die ganze Zeit gleichmäßig langsam sein.","dosis":"3-4S x 6-15W, Last nach Wochenplan steigern: Woche 1 = 15RM, Woche 2-3 = 12RM, Woche 4-5 = 10RM, Woche 6-8 = 8RM, Woche 9-12 = 6RM · 3 s konzentrisch - 1 s halten - 3 s exzentrisch (TUT ca. 6-7 s pro Wdh) · 3 x / Woche, mindestens 48 h Abstand","kurz":"3-4S x 6-15W, Last nach Wochenplan steigern: Woche 1 = 15RM, Woche 2-3 = 12RM, Woche 4-5 = 10RM, Woche 6-8 = 8RM, Woche 9-12 = 6RM","hinweis":"Zu schnell","bilder":[],"video":""},{"id":"SPG-PFL-KRA-SEH-03","name":"Heavy Slow Resistance Wadenheben, Knie gebeugt (Soleus-Anteil)","instruktion":"Knie bleibt die ganze Zeit gebeugt. Nur der Fuß bewegt sich.","dosis":"3S x 8-15W, gleiche Wochenprogression wie SEH-02 · 3 s / 1 s / 3 s · 3 x / Woche, gemeinsam mit SEH-02","kurz":"3S x 8-15W, gleiche Wochenprogression wie SEH-02","hinweis":"Knie streckt sich während der Bewegung durch","bilder":[],"video":""},{"id":"SPG-PFL-KRA-SEH-04","name":"Exzentrisches Fersenabsenken über Stufenkante (Alfredson-Protokoll)","instruktion":"Hoch mit beiden, runter nur mit dem betroffenen Bein - langsam.","dosis":"3S x 15W mit gestrecktem Knie und 3S x 15W mit gebeugtem Knie, 2 x täglich = 180 Wdh pro Tag · exzentrisch ca. 3 s, konzentrischer Anteil entfällt · täglich, über 12 Wochen","kurz":"3S x 15W mit gestrecktem Knie und 3S x 15W mit gebeugtem Knie, 2 x täglich = 180 Wdh pro Tag","hinweis":"Konzentrisch mit dem betroffenen Bein hochkommen","bilder":[],"video":""},{"id":"SPG-PFL-KRA-SEH-05","name":"Energiespeicher-Belastung: Pogo Hops und Sprunglauf (Stufe 3 Sehne)","instruktion":"Stell dir vor, der Boden ist heiß. Kurze, federnde Sprünge aus dem Sprunggelenk, das Knie bleibt fast starr.","dosis":"4-6S x 20-30 Kontakte · reaktiv, Bodenkontakt unter 250 ms · 2 x / Woche, mindestens 48 h Abstand zu anderer Sehnenbelastung","kurz":"4-6S x 20-30 Kontakte","hinweis":"Zu tief einsinken (wird zur Kraftübung statt Federübung)","bilder":[],"video":""},{"id":"SPG-PFL-KRA-SEH-06","name":"Sportspezifische Belastungsrückführung (Stufe 4 Sehne)","instruktion":"Wir bauen die Belastung in kleinen Schritten auf. Jede Steigerung wird am nächsten Morgen überprüft.","dosis":"individuell nach Sportart und Trainingsplan · sportartspezifisch · 2-3 x / Woche intensiv","kurz":"individuell nach Sportart und Trainingsplan","hinweis":"Zu schneller Umfangsaufbau","bilder":[],"video":""},{"id":"SPG-PFL-KRA-SEH-07","name":"Isometrisches Wadenheben im Sitz gegen die Tischplatte, Knie gebeugt (Soleus-Anteil, Stufe 1 Sehne)","instruktion":"Setz dich an einen stabilen Tisch, deine Knie sind unter der Tischplatte. Heb die Fersen an, bis deine Knie von unten gegen den Tisch drücken, und drück dann weiter nach oben - dabei bewegt sich nichts mehr. Halte die Spannung ruhig und atme weiter.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Tisch zu leicht und hebt sich an","bilder":[],"video":""},{"id":"SPG-PFL-MOB-KRP-01","name":"Zyklische Entlastungsmobilisation Fahrradergometer","instruktion":"Locker treten, hohe Frequenz, wenig Widerstand. Es soll nicht anstrengend sein, sondern gleichmäßig.","dosis":"20-40 min am Stück · 80-90 Umdrehungen pro Minute · täglich bis 5 x / Woche","kurz":"20-40 min am Stück","hinweis":"Zu hoher Widerstand (wird zur Kompressionsbelastung), zu kurze Dauer, zu tiefer Sattel mit eingeschränktem ROM","bilder":[],"video":""},{"id":"SPG-PRO-KRA-MUS-01","name":"Eversion gegen Theraband (Peronealgruppe)","instruktion":"Nur der Fuß bewegt sich nach außen, das Bein bleibt liegen. Langsam zurück.","dosis":"3S x 15W · 2 s / 1 s / 3 s · täglich in P1, danach 3 x / Woche","kurz":"3S x 15W","hinweis":"Ausweichen über Außenrotation der Hüfte","bilder":[],"video":""},{"id":"SPG-PRO-KRA-SEH-01","name":"Isometrische Eversion gegen die Wand (Peronealsehnen, Stufe 1)","instruktion":"Setz dich auf einen Stuhl, dein Fuß steht flach am Boden und die Außenkante liegt an der Wand. Drück den Fuß nach außen gegen die Wand - dabei bewegt sich nichts. Das Knie bleibt ruhig. Halte die Spannung und atme weiter.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Ausweichen über die Hüfte, Knie kippt nach außen","bilder":[],"video":""},{"id":"SPG-SUP-KRA-SEH-01","name":"Einbeiniges Wadenheben mit Vorfußadduktion (Tibialis posterior)","instruktion":"Erst das Fußgewölbe aufrichten, dann hochgehen. Die Ferse dreht dabei leicht nach innen, nicht nach außen wegkippen.","dosis":"3-4S x 8-12W · 3 s / 1 s / 3 s · 3 x / Woche, 48 h Abstand","kurz":"3-4S x 8-12W","hinweis":"Ferse kippt nach außen","bilder":[],"video":""},{"id":"SPG-SUP-KRA-SEH-02","name":"Isometrische Inversion gegen Widerstand (Tibialis-posterior-Sehne, Stufe 1)","instruktion":"Setz dich auf einen Stuhl, deine Ferse ist ganz leicht angehoben. Die Innenkante deines Vorfußes liegt an einem Tischbein oder am anderen Fuß. Drück den Fuß nach innen gegen den Widerstand - dabei bewegt sich nichts. Die Zehen bleiben locker. Halte die Spannung und atme weiter.","dosis":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s · isometrisch, Spannung 2-3 s langsam aufbauen, halten, langsam lösen · 2 x täglich, jeden Tag","kurz":"Start 3S x 30 s, schrittweise steigern bis 5S x 45 s","hinweis":"Zehen krallen statt den Fuß nach innen zu drücken","bilder":[],"video":""},{"id":"ZEH-I1F-KRA-MUS-01","name":"Großzehen-Endgelenk Beweglichkeit und Kräftigung","instruktion":"Halt dein großes Zehengrundgelenk leicht fest und beweg nur die Zehenspitze auf und ab.","dosis":"3S x 10-12W · 2 s pro Richtung · täglich","kurz":"3S x 10-12W","hinweis":"Grundgelenk bewegt mit statt isoliert das Endgelenk zu bewegen","bilder":[],"video":""},{"id":"ZEH-I2F-KRA-MUS-01","name":"Isolierte Zehenkrallen (PIP/DIP Zehen II-V)","instruktion":"Roll deine Zehenspitzen wie kleine Krallen nach unten ein, ohne dass sich die Grundgelenke stark mitbewegen.","dosis":"3S x 10-12 Wiederholungen · 2 s einrollen, 2 s lösen · täglich","kurz":"3S x 10-12 Wiederholungen","hinweis":"Bewegung kommt hauptsächlich aus dem Grundgelenk statt aus den Zwischengelenken","bilder":[],"video":""},{"id":"ZEH-M1D-KRA-MUS-01","name":"Großzehenheben Kräftigung","instruktion":"Heb nur deine große Zehe vom Boden ab, die anderen Zehen bleiben liegen. Halte kurz und senk sie wieder.","dosis":"3S x 10-15W · 2 s hoch, 2 s runter · täglich","kurz":"3S x 10-15W","hinweis":"alle Zehen heben gemeinsam ab statt isoliert die gro <script>
/* ics_generator_ENTWURF.js
 *
 * Entwurf, noch nicht in ein Tool eingebaut. Isolierte, testbare Funktion,
 * die aus einer Übungsauswahl eine RFC-5545-konforme .ics-Datei baut -
 * fuer einen wiederkehrenden Trainingstermin mit voller Uebungsliste im
 * Beschreibungstext. Rein clientseitig, keine Abhaengigkeiten, kein
 * Build-Step - laeuft per <script> im Browser und per `node` fuer die
 * Tests (siehe ics_generator_ENTWURF.test.js).
 *
 * buildTrainingsplanICS (26.08.2026): ein einzelner Serientermin, bewusst
 * ohne Link - DESCRIPTION enthaelt die komplette Anleitung als Text.
 *
 * buildPlanICS / googleKalenderLink (05.10.2026, Planversand): mehrere
 * Serien je Plan (eine pro Einheit und Uhrzeit), jede mit Link zurueck zur
 * Patientenseite - im URL-Feld (Apple) und als Klartext in der
 * Beschreibung (Google, Outlook). Der Plan selbst steckt nur im Link,
 * siehe planlink.js. Entscheidung Olli 04./05.10.2026.
 */

var WOCHENTAG_CODES = { MO: "MO", DI: "TU", MI: "WE", DO: "TH", FR: "FR", SA: "SA", SO: "SU" };

/* ---------- Hilfsfunktionen ---------- */

// RFC 5545 TEXT-Escaping: Backslash zuerst, dann Komma/Semikolon/Zeilenumbruch.
function icsEscape(text) {
  return String(text == null ? "" : text)
    .replace(/\\/g, "\\\\")
    .replace(/;/g, "\\;")
    .replace(/,/g, "\\,")
    .replace(/\r\n|\n|\r/g, "\\n");
}

function utf8ByteLength(ch) {
  if (typeof TextEncoder !== "undefined") return new TextEncoder().encode(ch).length;
  return Buffer.byteLength(ch, "utf8"); // Node-Fallback
}

// Line Folding bei > 75 Oktetten. Es wird immer ein ganzes Zeichen verschoben,
// nie mitten in eine Mehrbyte-UTF-8-Sequenz geschnitten (RFC 5545 §3.1).
function icsFoldLine(line) {
  var LIMIT = 75;
  var chars = Array.from(line); // codepoint-sicher (Umlaute, Emoji etc.)
  var out = [];
  var current = "";
  var currentBytes = 0;
  for (var i = 0; i < chars.length; i++) {
    var ch = chars[i];
    var chBytes = utf8ByteLength(ch);
    if (currentBytes + chBytes > LIMIT && current.length > 0) {
      out.push(current);
      current = " " + ch; // Folgezeile beginnt mit genau einem Leerzeichen
      currentBytes = 1 + chBytes;
    } else {
      current += ch;
      currentBytes += chBytes;
    }
  }
  out.push(current);
  return out.join("\r\n");
}

function pad2(n) { return (n < 10 ? "0" : "") + n; }

// "YYYY-MM-DD" + "HH:MM" -> "YYYYMMDDTHHMMSS" (floating local time, kein Z/TZID)
function icsLocalDateTime(datumISO, uhrzeit) {
  var d = datumISO.replace(/-/g, "");
  var t = uhrzeit.replace(":", "") + "00";
  return d + "T" + t;
}

function icsUtcStamp(date) {
  return date.getUTCFullYear() + pad2(date.getUTCMonth() + 1) + pad2(date.getUTCDate()) +
    "T" + pad2(date.getUTCHours()) + pad2(date.getUTCMinutes()) + pad2(date.getUTCSeconds()) + "Z";
}

// Einfacher, deterministischer String-Hash (kein Krypto-Anspruch - nur
// stabil: gleiche Eingabe -> gleiche UID, damit ein erneuter Import
// aktualisiert statt dupliziert).
function stableHash(text) {
  var h = 5381;
  for (var i = 0; i < text.length; i++) {
    h = ((h << 5) + h + text.charCodeAt(i)) | 0;
  }
  return (h >>> 0).toString(36);
}

function addMinutes(hhmm, minuten) {
  var parts = hhmm.split(":");
  var totalMin = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10) + minuten;
  totalMin = ((totalMin % 1440) + 1440) % 1440;
  return pad2(Math.floor(totalMin / 60)) + ":" + pad2(totalMin % 60);
}

/* ---------- Hauptfunktion ---------- */

/**
 * @param {Object} plan
 * @param {string} plan.uidNamespace   z.B. "uebungskatalog.local" oder "hsv-monitoring.local"
 * @param {string} plan.planId         stabile Kennung fuer diesen Plan (z.B. "0007-2026-KW35")
 * @param {string} plan.code           Pseudonym-Code, nur fuer Titel/Dateiname (z.B. "HSV-007" oder "Pat-0042")
 * @param {string} plan.titel          Kurztitel fuer SUMMARY, z.B. "Reha Rotatorenmanschette"
 * @param {Array}  plan.uebungen       [{name, dosierung, hinweis}], reiner Text, keine Bilder/Links
 * @param {string} plan.startDatum     "YYYY-MM-DD" des ersten Termins
 * @param {string} plan.uhrzeit        "HH:MM"
 * @param {number} plan.dauerMin       Termindauer in Minuten
 * @param {Array}  plan.wochentage     Teilmenge von ["MO","DI","MI","DO","FR","SA","SO"]
 * @param {number} plan.anzahlWochen   Anzahl Wochen, ueber die der Plan laeuft
 * @param {number} [plan.erinnerungMinVorher=30]
 * @returns {{ics: string, dateiname: string}}
 */
function buildTrainingsplanICS(plan) {
  if (!plan.wochentage || !plan.wochentage.length) {
    throw new Error("Mindestens ein Wochentag erforderlich");
  }
  if (!plan.uebungen || !plan.uebungen.length) {
    throw new Error("Mindestens eine Uebung erforderlich");
  }

  var erinnerung = plan.erinnerungMinVorher == null ? 30 : plan.erinnerungMinVorher;
  var dtStart = icsLocalDateTime(plan.startDatum, plan.uhrzeit);
  var endUhrzeit = addMinutes(plan.uhrzeit, plan.dauerMin);
  var dtEnd = icsLocalDateTime(plan.startDatum, endUhrzeit);
  var dtStamp = icsUtcStamp(new Date());

  var byday = plan.wochentage.map(function (w) { return WOCHENTAG_CODES[w]; }).join(",");
  // COUNT zaehlt einzelne Termine, nicht Wochen: Wochentage x Wochen (RFC-5545-Semantik von FREQ=WEEKLY + BYDAY).
  var count = plan.wochentage.length * plan.anzahlWochen;

  var uid = stableHash(plan.code + "|" + plan.planId + "|" + plan.startDatum) + "@" + plan.uidNamespace;

  var beschreibung = plan.uebungen.map(function (u, i) {
    var zeile = (i + 1) + ". " + u.name + " - " + u.dosierung;
    if (u.hinweis) zeile += " (" + u.hinweis + ")";
    return zeile;
  }).join("\n");

  var summary = icsEscape(plan.titel);
  var description = icsEscape(beschreibung);

  var lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Praxisbetriebssystem//Trainingsplan//DE",
    "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:" + uid,
    "DTSTAMP:" + dtStamp,
    "DTSTART:" + dtStart,
    "DTEND:" + dtEnd,
    "RRULE:FREQ=WEEKLY;BYDAY=" + byday + ";COUNT=" + count,
    "SUMMARY:" + summary,
    "DESCRIPTION:" + description,
    "BEGIN:VALARM",
    "ACTION:DISPLAY",
    "DESCRIPTION:" + summary,
    "TRIGGER:-PT" + erinnerung + "M",
    "END:VALARM",
    "END:VEVENT",
    "END:VCALENDAR"
  ];

  var ics = lines.map(icsFoldLine).join("\r\n") + "\r\n";
  var dateiname = plan.code + "_" + plan.planId + ".ics";

  return { ics: ics, dateiname: dateiname };
}

/* ---------- Planversand: mehrere Serien mit Link ---------- */

// Wochentage als Index 0 = Montag ... 6 = Sonntag
var RFC_TAGE = ["MO", "TU", "WE", "TH", "FR", "SA", "SU"];

function datumPlusTage(datumISO, n) {
  var t = datumISO.split("-");
  var d = new Date(Date.UTC(+t[0], +t[1] - 1, +t[2] + n));
  return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
}

function wochentagIndex(datumISO) {
  var t = datumISO.split("-");
  return (new Date(Date.UTC(+t[0], +t[1] - 1, +t[2])).getUTCDay() + 6) % 7;
}

// RFC 5545: DTSTART muss selbst ein Termin der Serie sein, sonst ist das
// Ergebnis undefiniert (Google und Apple legen dann einen Extra-Termin an).
// Deshalb startet die Serie am ersten passenden Wochentag ab dem Startdatum.
function ersterTermin(datumISO, tage) {
  for (var i = 0; i < 7; i++) {
    var d = datumPlusTage(datumISO, i);
    if (tage.indexOf(wochentagIndex(d)) !== -1) return d;
  }
  throw new Error("Mindestens ein Wochentag erforderlich");
}

// Ende eines Termins, auch ueber Mitternacht hinweg
function terminEnde(datumISO, uhrzeit, dauerMin) {
  var p = uhrzeit.split(":");
  var min = parseInt(p[0], 10) * 60 + parseInt(p[1], 10) + dauerMin;
  return {
    datum: datumPlusTage(datumISO, Math.floor(min / 1440)),
    uhrzeit: pad2(Math.floor((min % 1440) / 60)) + ":" + pad2(min % 60)
  };
}

function serienRegel(s) {
  var regel = s.tage.length === 7 ? "FREQ=DAILY"
    : "FREQ=WEEKLY;BYDAY=" + s.tage.slice().sort().map(function (t) { return RFC_TAGE[t]; }).join(",");
  return regel + ";COUNT=" + s.anzahl;
}

function erinnerungTrigger(s) {
  if (s.uhrzeit) {
    var vorher = s.erinnerung || 0;
    return vorher ? "TRIGGER:-PT" + vorher + "M" : "TRIGGER:PT0M";
  }
  // ganztaegig: Erinnerung zur Uhrzeit am Tag selbst, gerechnet ab 0:00
  var hm = (s.erinnerung || "09:00").split(":");
  var h = parseInt(hm[0], 10), m = parseInt(hm[1], 10);
  return "TRIGGER;RELATED=START:PT" + h + "H" + (m ? m + "M" : "");
}

/**
 * @param {Array} serien  je Serie: {
 *   uid, sequenz, titel, beschreibung, url,
 *   startDatum "YYYY-MM-DD" (Planstart, wird auf den ersten passenden Tag geschoben),
 *   uhrzeit "HH:MM" oder null fuer ganztaegig, dauerMin,
 *   tage [0..6, 0 = Montag], anzahl (Zahl der Termine),
 *   erinnerung: mit Uhrzeit Minuten vorher (0 = zum Termin), ganztaegig "HH:MM" }
 * @returns {{ics: string, dateiname: string}}
 */
function buildPlanICS(serien) {
  if (!serien || !serien.length) throw new Error("Mindestens eine Terminserie erforderlich");
  var dtStamp = icsUtcStamp(new Date());
  var lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//O.G. Physiotherapie//Uebungsprogramm//DE",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH"
  ];
  serien.forEach(function (s) {
    var start = ersterTermin(s.startDatum, s.tage);
    lines.push("BEGIN:VEVENT", "UID:" + s.uid, "DTSTAMP:" + dtStamp);
    if (s.sequenz) lines.push("SEQUENCE:" + s.sequenz);
    if (s.uhrzeit) {
      var ende = terminEnde(start, s.uhrzeit, s.dauerMin);
      lines.push("DTSTART:" + icsLocalDateTime(start, s.uhrzeit),
                 "DTEND:" + icsLocalDateTime(ende.datum, ende.uhrzeit));
    } else {
      lines.push("DTSTART;VALUE=DATE:" + start.replace(/-/g, ""),
                 "DTEND;VALUE=DATE:" + datumPlusTage(start, 1).replace(/-/g, ""),
                 "TRANSP:TRANSPARENT");
    }
    lines.push("RRULE:" + serienRegel(s),
               "SUMMARY:" + icsEscape(s.titel),
               "DESCRIPTION:" + icsEscape(s.beschreibung));
    // URL ist vom Typ URI, nicht TEXT - deshalb kein icsEscape
    if (s.url) lines.push("URL;VALUE=URI:" + s.url);
    lines.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEscape(s.titel),
               erinnerungTrigger(s), "END:VALARM", "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return { ics: lines.map(icsFoldLine).join("\r\n") + "\r\n", dateiname: "Uebungsprogramm.ics" };
}

// Vorbelegter Termin fuer den Google-Kalender (eine Serie pro Link). Fuer
// Android: Die Google-Kalender-App oeffnet .ics-Dateien nicht zuverlaessig.
function googleKalenderLink(s) {
  var start = ersterTermin(s.startDatum, s.tage);
  var zeitraum;
  if (s.uhrzeit) {
    var ende = terminEnde(start, s.uhrzeit, s.dauerMin);
    zeitraum = icsLocalDateTime(start, s.uhrzeit) + "/" + icsLocalDateTime(ende.datum, ende.uhrzeit);
  } else {
    zeitraum = start.replace(/-/g, "") + "/" + datumPlusTage(start, 1).replace(/-/g, "");
  }
  return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(s.titel) +
    "&dates=" + zeitraum +
    "&details=" + encodeURIComponent(s.beschreibung) +
    "&recur=" + encodeURIComponent("RRULE:" + serienRegel(s));
}

if (typeof module !== "undefined" && module.exports) {

 *                    uebungen: [ {id, dosierung, hinweis} | {name, dosierung, hinweis} ] } ] }

var PLAN_PRAEFIX = "p1.";
var PLAN_GRENZEN = { einheiten: 6, uebungen: 30, zeiten: 4, wochen: 52, titel: 60, text: 300 };

function base64urlKodieren(text) {

function base64urlDekodieren(text) {

function planKodieren(plan) {

    i: plan.id, r: plan.revision || 1, t: plan.titel || undefined,
    a: plan.anrede === "sie" ? "s" : "d", s: plan.start, w: plan.wochen,
    n: plan.notiz || undefined,
    e: plan.einheiten.map(function (e) {

        b: e.name || undefined,
        d: tageAlsMaske(e.tage),
        z: e.ganztaegig ? undefined : e.zeiten,
        g: e.ganztaegig ? (e.erinnerung || "09:00") : undefined,
        m: e.ganztaegig ? undefined : e.dauer,
        u: e.uebungen.map(function (u) {
          var k = u.id ? { i: u.id } : { f: u.name };
          if (u.dosierung) k.o = u.dosierung;
          if (u.hinweis) k.h = u.hinweis;
          return k;
        })
      };

/* ---------- Auslesen und Pruefen ---------- */

function planFehler(text) { var e = new Error(text); e.planFehler = true; return e; }

function textFeld(wert, max) {
  if (wert == null) return "";
  if (typeof wert !== "string") throw planFehler("Der Link enthält ungültige Angaben");
  return wert.trim().slice(0, max);
}

function gueltigesDatum(iso) {
  if (typeof iso !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  return datumPlusTage(iso, 0) === iso; // faengt z. B. 2026-02-30 ab

// Text hinter dem "#" -> gepruefte Langform. Wirft einen Fehler mit
// verstaendlichem Text, wenn der Link fehlt, abgeschnitten oder veraendert ist.
function planDekodieren(hash) {
  var text = String(hash || "").replace(/^#/, "");
  if (!text) throw planFehler("Kein Übungsprogramm im Link");
  if (text.indexOf(PLAN_PRAEFIX) !== 0) throw planFehler("Dieser Link enthält kein Übungsprogramm");

function planPruefen(k) {

  var wochen = k.w;

    throw planFehler("Im Link fehlt eine gültige Anzahl Wochen");

    if (typeof e.d !== "string" || !/^[01]{7}$/.test(e.d) || e.d.indexOf("1") === -1)
      throw planFehler("Eine Einheit hat keine gültigen Wochentage");
    var ganz = e.g != null;
    if (ganz && !UHRZEIT.test(e.g)) throw planFehler("Eine Einheit hat keine gültige Erinnerungszeit");
    if (!ganz && (!Array.isArray(e.z) || !e.z.length || e.z.length > PLAN_GRENZEN.zeiten ||

      throw planFehler("Eine Einheit hat keine gültige Uhrzeit");
    var dauer = typeof e.m === "number" && e.m >= 5 && e.m <= 240 && e.m % 1 === 0 ? e.m : 15;
    if (!Array.isArray(e.u) || !e.u.length) throw planFehler("Eine Einheit enthält keine Übungen");

    if (gesamt > PLAN_GRENZEN.uebungen) throw planFehler("Der Link enthält zu viele Übungen");
    return {
      name: textFeld(e.b, PLAN_GRENZEN.titel),
      tage: maskeAlsTage(e.d),
      zeiten: ganz ? [] : e.z.filter(function (z, i) { return e.z.indexOf(z) === i; }).sort(),
      ganztaegig: ganz,

      dauer: dauer,

    notiz: textFeld(k.n, PLAN_GRENZEN.text), einheiten: einheiten

}

var TAG_KURZ = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
var MONAT_KURZ = ["Jan.", "Feb.", "März", "Apr.", "Mai", "Juni", "Juli", "Aug.", "Sept.", "Okt.", "Nov.", "Dez."];

function planEnde(plan) { return datumPlusTage(plan.start, plan.wochen * 7 - 1); }

  if (tage.length === 7) return "täglich";
  if (tage.join() === "0,1,2,3,4") return "Mo–Fr";
  return tage.map(function (t) { return TAG_KURZ[t]; }).join(", ");
}

  return teile.length < 2 ? teile.join("") : teile.slice(0, -1).join(", ") + " und " + teile[teile.length - 1];
}

// katalog(id) liefert {name, dosis, kurz, hinweis} oder null. dosis = Zettel-Vorbelegung
// (Dosierung · Tempo · Frequenz), kurz = nur die Dosierung fuer die Kalendernotiz.
function uebungAnzeige(u, katalog) {

  var k = katalog(u.id);

function planSerien(plan, katalog, link) {

  plan.einheiten.forEach(function (e, k) {

      serien.push(s);

      <ul class="zeitplan">${zeitplan}</ul>
      <div class="nur-bildschirm">
        <p class="hilfe" style="margin:0 0 12px">${esc(T.kalenderInfo)}</p>
        ${iphone}
        <button class="knopf" id="b-ics" type="button">In meinen Kalender eintragen</button>
        ${hilfe}
        <details class="google" ${ANDROID ? "open" : ""}>
          <summary>${esc(T.googleFrage)}</summary>
          <p>${esc(T.googleText)}</p>
          ${google}
        </details>
        <p class="privat">${esc(T.privat)}</p>
      </div>
    </section>
    ${plan.notiz ? `<section class="karte notiz"><h2>Hinweis</h2><p>${esc(plan.notiz)}</p></section>` : ""}
    ${bloecke}
    <footer class="fuss">
      ${adl ? `<p><b>Sicherheit:</b> ${esc(T.sicherheit)}</p>` : ""}
      <p><b>Schmerzregel:</b> Beschwerden während der Übung bis etwa 3–5 von 10 sind in Ordnung,
        solange sie bis zum nächsten Morgen wieder auf dem Ausgangsniveau sind. Halten sie länger
        als 24 Stunden an oder nehmen sie zu, ${esc(T.schmerz)}.</p>
      <p><b>Bei Fragen:</b> lieber einmal nachfragen als falsch üben.</p>
      <button class="knopf zweit nur-bildschirm" id="b-druck" type="button">Drucken oder als PDF speichern</button>
      <p class="rechtlich">Zusammengestellt von O.G. Physiotherapie – mobile Physiotherapie.${rechtlich ? "<br>" + rechtlich : ""}</p>
    </footer>`;

  $("#b-ics").addEventListener("click", kalenderDatei);
  $("#b-druck").addEventListener("click", () => window.print());
}

// Kalenderdatei herunterladen bzw. öffnen. Android: Kalender fragt direkt.
// iPhone: nur in Safari, dort „Anzeigen“ → „Alle hinzufügen“.
function kalenderDatei() {
  const erg = buildPlanICS(SERIEN);
  const url = URL.createObjectURL(new Blob([erg.ics], { type: "text/calendar;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = erg.dateiname;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}

window.addEventListener("hashchange", zeige);
zeige();
</script>
